<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Inventory Gudang</title>
    
    <!-- Load Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Load React -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Load Tone.js for Sound Effects -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>

    <!-- Load SheetJS for Excel export/import -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    
    <style>
        /* Print styles to ensure reports look good on paper */
        @media print {
            body { background: white !important; color: black !important; }
            .no-print, header, nav, button { display: none !important; }
            .print-container { width: 100% !important; margin: 0 !important; padding: 0 !important; box-shadow: none !important; border: none !important; }
        }
        /* Custom scrollbar for better aesthetics */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #f1f5f9; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        
        /* Modal animation */
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        .modal-overlay {
            animation: fadeIn 0.2s ease-out forwards;
        }
    </style>
</head>
<body class="bg-slate-100 min-h-screen text-slate-900 font-sans text-sm selection:bg-blue-200 selection:text-blue-900">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useMemo, useEffect } = React;

        // --- Data Constants ---
        const ITEMS = ['ONT ZTE', 'ONT HUAWEI', 'STB ZTE', 'STB NAVICOM', 'STB TRANSVISION', 'STB HOMATIC', 'STB FIBERHOME'];
        const TECHNICIANS = ['PUTRA-SONY', 'EKO-RIYAN', 'NADI-PARI', 'ARIP', 'NOVAN-GOBY', 'PERI-ROBIN', 'TEDI-DODI', 'DODi-DANIEL-TEDI', 'RAHMAN-FAJAR', 'IQBAL-ARDI', 'RIO-ARI', 'AGUS'];
        const MONTHS = ['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni', 'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'];
        const CABLE_ITEMS = [
          'DTFIBER - CABLE PRECON SC/UPC-SC/APC - 75MTR',
          'DTFIBER - CABLE PRECON SC/UPC-SC/APC - 125MTR',
          'DTFIBER - CABLE PRECON SC/UPC-SC/APC - 175MTR',
          'DTFIBER - CABLE PRECON SC/UPC-SC/APC - 225MTR',
          'DTFIBER - CABLE PRECON SC/UPC-SC/APC - 300MTR'
        ];

        // --- UI Icons ---
        const IconDashboard = () => <svg className="w-5 h-5 inline" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M4 5a1 1 0 011-1h4a1 1 0 011 1v4a1 1 0 01-1 1H5a1 1 0 01-1-1V5zM14 5a1 1 0 011-1h4a1 1 0 011 1v4a1 1 0 01-1 1h-4a1 1 0 01-1-1V5zM4 15a1 1 0 011-1h4a1 1 0 011 1v4a1 1 0 01-1 1H5a1 1 0 01-1-1v-5zM14 15a1 1 0 011-1h4a1 1 0 011 1v4a1 1 0 01-1 1h-4a1 1 0 01-1-1v-5z"/></svg>;
        const IconPackage = () => <svg className="w-5 h-5 inline" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"/></svg>;
        const IconSearch = () => <svg className="w-5 h-5 inline" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path strokeLinecap="round" strokeLinejoin="round" d="M21 21l-4.35-4.35"/></svg>;
        const IconUsers = () => <svg className="w-5 h-5 inline" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"/></svg>;
        const IconPlus = () => <svg className="w-5 h-5 inline" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M12 4v16m8-8H4"/></svg>;
        const IconUpload = () => <svg className="w-5 h-5 inline" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"/></svg>;
        const IconChart = () => <svg className="w-5 h-5 inline" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M18 20V10M12 20V4M6 20v-6"/></svg>;
        const IconExchange = () => <svg className="w-5 h-5 inline" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M8 7h12m0 0l-4-4m4 4l-4 4m0 6H4m0 0l4 4m-4-4l4-4"/></svg>;
        const IconLayers = () => <svg className="w-5 h-5 inline" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M12 2l10 5-10 5-10-5 10-5zM2 17l10 5 10-5M2 17l10-5M2 12l10 5 10-5"/></svg>;
        const IconClose = () => <svg className="w-6 h-6 inline" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>;
        const IconTrash = () => <svg className="w-5 h-5 inline" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>;
        const IconAlertCircle = () => <svg className="w-12 h-12 text-red-500 mb-4 mx-auto" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>;
        const IconEye = () => <svg className="w-5 h-5 inline" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" /><path strokeLinecap="round" strokeLinejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" /></svg>;
        const IconEyeOff = () => <svg className="w-5 h-5 inline" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21" /></svg>;

        // --- Sound Effects Setup (Tone.js) ---
        const playSuccessSound = async () => {
            try {
                await Tone.start();
                const synth = new Tone.PolySynth(Tone.Synth, {
                    oscillator: { type: "sine" },
                    envelope: { attack: 0.02, decay: 0.1, sustain: 0.2, release: 1 }
                }).toDestination();
                const now = Tone.now();
                // Play a quick ascending chime (C5 -> E5 -> G5)
                synth.triggerAttackRelease("C5", "16n", now);
                synth.triggerAttackRelease("E5", "16n", now + 0.1);
                synth.triggerAttackRelease("G5", "8n", now + 0.2);
            } catch(e) { console.warn("Audio error", e); }
        };

        const playErrorSound = async () => {
            try {
                await Tone.start();
                const synth = new Tone.Synth({
                    oscillator: { type: "sawtooth" },
                    envelope: { attack: 0.05, decay: 0.2, sustain: 0.2, release: 0.4 }
                }).toDestination();
                const now = Tone.now();
                // Play a descending error buzz (Eb3 -> C3)
                synth.triggerAttackRelease("Eb3", "8n", now);
                synth.triggerAttackRelease("C3", "4n", now + 0.15);
            } catch(e) { console.warn("Audio error", e); }
        };

        function App() {
          // System State
          const [scriptUrl, setScriptUrl] = useState(() => localStorage.getItem('gs_url') || '');
          const [tempUrl, setTempUrl] = useState('');
          const [activeTab, setActiveTab] = useState('dashboard');
          const [toast, setToast] = useState(null);
          const [isLoading, setIsLoading] = useState(false);
          const [confirmModal, setConfirmModal] = useState(null); // Custom modal state to replace alert/confirm

          // Data State
          const [masterData, setMasterData] = useState([]);
          const [outboundData, setOutboundData] = useState([]);
          const [cableStockInbound, setCableStockInbound] = useState([]);
          
          // Form State
          const [selectedTech, setSelectedTech] = useState(TECHNICIANS[0]);
          const [scanSn, setScanSn] = useState('');
          const [manualItem, setManualItem] = useState(CABLE_ITEMS[0]);
          const [manualQty, setManualQty] = useState('');
          const [newCableItem, setNewCableItem] = useState(CABLE_ITEMS[0]);
          const [newCableQty, setNewCableQty] = useState('');
          const [showImport, setShowImport] = useState(false);
          const [importData, setImportData] = useState('');
          
          // Pagination State
          const [currentPage, setCurrentPage] = useState(1);
          const ITEMS_PER_PAGE = 50;

          // Report Filters State
          const [reportType, setReportType] = useState('bulanan');
          const [reportDate, setReportDate] = useState(() => new Date().toISOString().split('T')[0]);
          const [reportMonth, setReportMonth] = useState(new Date().getMonth());
          const [reportYear, setReportYear] = useState(new Date().getFullYear());
          const [reportWeek, setReportWeek] = useState(1);
          const [reportTech, setReportTech] = useState(TECHNICIANS[0]);
          
          // UI Toggle States
          const [showSummaryTable, setShowSummaryTable] = useState(false);

          // --- Core Functions ---
          const showMessage = (msg, type = 'success') => {
            setToast({ msg, type });
            setTimeout(() => setToast(null), 4000);
          };

          const saveUrl = (e) => {
            e.preventDefault();
            if (!tempUrl.trim()) return;
            localStorage.setItem('gs_url', tempUrl.trim());
            setScriptUrl(tempUrl.trim());
            showMessage('URL Google Sheet berhasil disimpan!');
          };

          const fetchData = async () => {
            if (!scriptUrl) return;
            setIsLoading(true);
            try {
              const res = await fetch(scriptUrl);
              const json = await res.json();
              
              if (json.master && json.master.length > 1) {
                const loadedMaster = json.master.slice(1).map(row => ({
                  item: row[0], sn: row[1], code: row[2], dateAdded: row[3] || new Date().toISOString()
                })).filter(d => d.sn);
                setMasterData(loadedMaster);
              }

              if (json.outbound && json.outbound.length > 1) {
                const loadedOut = json.outbound.slice(1).map(row => ({
                  id: row[0], waktuScan: row[1], namaTeknisi: row[2], sn: row[3], namaBarang: row[4], kabelPrecon: row[5], keterangan: row[6], status: row[7] || 'BELUM', month: Number(row[8]), week: Number(row[9]), qty: Number(row[10]), unit: row[11]
                })).filter(d => d.id);
                setOutboundData(loadedOut);
              }

              if (json.cables && json.cables.length > 1) {
                const loadedCables = json.cables.slice(1).map(row => ({
                  id: row[0], item: row[1], qty: Number(row[2]), date: row[3]
                })).filter(d => d.id);
                setCableStockInbound(loadedCables);
              }
            } catch (err) {
              console.error("Fetch error", err);
              showMessage('Gagal memuat data. Periksa URL Apps Script.', 'error');
            }
            setIsLoading(false);
          };

          // Fetch on URL change
          useEffect(() => {
            if (scriptUrl) fetchData();
          }, [scriptUrl]);

          // --- Sync Functions ---
          const syncDataToSheet = async (type, rows) => {
            if (!scriptUrl) return;
            try {
                await fetch(scriptUrl, { 
                    method: 'POST', 
                    body: JSON.stringify({ type, rows }) 
                });
            } catch (error) {
                console.error("Sync error", error);
                showMessage(`Gagal sinkronisasi data ${type}.`, 'error');
            }
          };

          const syncMasterToSheet = async (newMaster) => {
            const rows = [["Item", "SN", "Code", "DateAdded"]];
            newMaster.forEach(d => rows.push([d.item, d.sn, d.code, d.dateAdded]));
            await syncDataToSheet("saveMaster", rows);
          };

          const syncOutboundToSheet = async (newOut) => {
            const rows = [["ID", "WaktuScan", "Teknisi", "SN", "Barang", "Kabel", "Ket", "Status", "Month", "Week", "Qty", "Unit"]];
            newOut.forEach(d => rows.push([d.id, d.waktuScan, d.namaTeknisi, d.sn, d.namaBarang, d.kabelPrecon, d.keterangan, d.status, d.month, d.week, d.qty, d.unit]));
            await syncDataToSheet("saveOutbound", rows);
          };

          const syncCablesToSheet = async (newCables) => {
            const rows = [["ID", "Item", "Qty", "Date"]];
            newCables.forEach(c => rows.push([c.id, c.item, c.qty, c.date]));
            await syncDataToSheet("saveCables", rows);
          };

          // --- Action Handlers ---
          const handleScan = async (e) => {
            e.preventDefault();
            if (!scanSn.trim()) return;
            const snToFind = scanSn.trim().toUpperCase().replace(/\s+/g, "");

            let foundIndex = masterData.findIndex(d => d.sn.replace(/\s+/g, "") === snToFind);
            if (foundIndex === -1) {
              // Fallback partial match if strict fails
              foundIndex = masterData.findIndex(d => d.sn.replace(/\s+/g, "").includes(snToFind) || snToFind.includes(d.sn.replace(/\s+/g, "")));
            }

            if (foundIndex === -1) {
              playErrorSound();
              showMessage(`SN "${scanSn}" tidak ditemukan di Master Data!`, 'error');
              setScanSn('');
              return;
            }

            const itemData = masterData[foundIndex];
            const now = new Date();
            const newOut = {
              id: Date.now().toString() + Math.random().toString(36).substr(2, 5),
              waktuScan: `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')} ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}:${String(now.getSeconds()).padStart(2,'0')}`,
              namaTeknisi: selectedTech,
              sn: itemData.sn,
              namaBarang: itemData.item,
              kabelPrecon: '-',
              keterangan: itemData.code || '-',
              status: 'BELUM',
              month: now.getMonth(),
              week: Math.ceil((now.getDate() + new Date(now.getFullYear(), now.getMonth(), 1).getDay()) / 7),
              qty: 1,
              unit: 'Unit'
            };

            const updatedMaster = [...masterData];
            updatedMaster.splice(foundIndex, 1);
            const updatedOut = [newOut, ...outboundData];

            setMasterData(updatedMaster);
            setOutboundData(updatedOut);
            
            await syncMasterToSheet(updatedMaster);
            await syncOutboundToSheet(updatedOut);

            playSuccessSound();
            showMessage(`Berhasil! ${itemData.item} ditugaskan ke ${selectedTech}.`);
            setScanSn('');
          };

          const handleManualAdd = async (e) => {
            e.preventDefault();
            if (!manualQty || isNaN(manualQty) || Number(manualQty) <= 0) {
              showMessage('Masukkan jumlah Pcs yang valid!', 'error');
              return;
            }

            const qtyToAdd = Number(manualQty);
            const now = new Date();
            const newOutbounds = [];
            const totalOut = outboundData.filter(d => d.kabelPrecon === manualItem).length;

            for (let i = 0; i < qtyToAdd; i++) {
              newOutbounds.push({
                id: `${Date.now()}-${i}-${Math.random().toString(36).substr(2, 5)}`,
                waktuScan: `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')} ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}:${String(now.getSeconds()).padStart(2,'0')}`,
                namaTeknisi: selectedTech,
                sn: '-',
                namaBarang: 'Kabel Precon',
                kabelPrecon: manualItem,
                keterangan: `Roll ${totalOut + i + 1}`,
                status: 'BELUM',
                month: now.getMonth(),
                week: Math.ceil((now.getDate() + new Date(now.getFullYear(), now.getMonth(), 1).getDay()) / 7),
                qty: 1,
                unit: 'Pcs'
              });
            }

            const updatedOut = [...newOutbounds, ...outboundData];
            setOutboundData(updatedOut);
            await syncOutboundToSheet(updatedOut);
            showMessage(`Berhasil mencatat ${qtyToAdd} Pcs ${manualItem}.`);
            setManualQty('');
          };

          const handleAddCableInbound = async (e) => {
            e.preventDefault();
            if (!newCableQty || isNaN(newCableQty) || Number(newCableQty) <= 0) return;

            const newEntry = {
              id: Date.now().toString() + Math.random().toString(36).substr(2, 5),
              item: newCableItem,
              qty: Number(newCableQty),
              date: new Date().toISOString()
            };

            const updatedCables = [newEntry, ...cableStockInbound];
            setCableStockInbound(updatedCables);
            await syncCablesToSheet(updatedCables);
            showMessage(`Berhasil menambah stok kabel.`);
            setNewCableQty('');
          };

          const requestDeleteOutbound = (id) => {
             const item = outboundData.find(d => d.id === id);
             if (item) {
                 setConfirmModal({
                     id,
                     title: 'Hapus Data Keluar',
                     message: `Hapus data barang keluar untuk teknisi ${item.namaTeknisi}? Jika ini memiliki SN, barang akan dikembalikan ke Master Data Gudang.`
                 });
             }
          };

          const confirmDeleteOutbound = async () => {
            if (!confirmModal || !confirmModal.id) return;
            const id = confirmModal.id;
            const itemToDelete = outboundData.find(d => d.id === id);
            
            if (!itemToDelete) {
                setConfirmModal(null);
                return;
            }

            const updatedOutbound = outboundData.filter(d => d.id !== id);
            setOutboundData(updatedOutbound);

            let updatedMaster = [...masterData];
            // Re-add to master if it was a serialized item
            if (itemToDelete.sn && itemToDelete.sn !== '-') {
              updatedMaster = [{
                item: itemToDelete.namaBarang,
                sn: itemToDelete.sn,
                code: itemToDelete.keterangan !== '-' && !itemToDelete.keterangan.startsWith('Roll') ? itemToDelete.keterangan : '-',
                dateAdded: new Date().toISOString()
              }, ...updatedMaster];
              setMasterData(updatedMaster);
              await syncMasterToSheet(updatedMaster);
            }

            await syncOutboundToSheet(updatedOutbound);
            showMessage('Data berhasil dihapus' + (itemToDelete.sn !== '-' ? ' & SN dikembalikan ke Gudang.' : '.'));
            setConfirmModal(null);
          };

          const handleBulkImport = async () => {
            if (!importData.trim()) return;
            const rows = importData.trim().split('\n');
            let addedCount = 0;
            const newData = [];

            rows.forEach(row => {
              if (!row.trim()) return;
              const cols = row.split(/\t+|\s{2,}/).map(c => c.trim()).filter(Boolean);
              if (cols.length >= 1) {
                let item = 'MATERIAL GUDANG', sn = '', code = '-';
                if (cols.length >= 3) {
                  // Handle potential formats
                  if (cols[0].toUpperCase().startsWith('DN')) { code = cols[0]; item = cols[1]; sn = cols[2]; }
                  else { item = cols[0]; sn = cols[1]; code = cols[2]; }
                } else if (cols.length === 2) { 
                    item = cols[0]; sn = cols[1]; 
                } else if (cols.length === 1) { 
                    sn = cols[0]; 
                }

                if (sn && sn !== '-') {
                  newData.push({ 
                      sn: sn.toUpperCase(), 
                      item: item.toUpperCase(), 
                      code: code.toUpperCase(), 
                      dateAdded: new Date().toISOString() 
                  });
                  addedCount++;
                }
              }
            });

            if (newData.length > 0) {
              const updatedMaster = [...newData, ...masterData];
              setMasterData(updatedMaster);
              await syncMasterToSheet(updatedMaster);
              showMessage(`Berhasil import ${addedCount} data SN ke Google Sheet!`);
            } else {
              showMessage('Format data tidak dikenali. Pastikan ada SN.', 'error');
            }
            
            setImportData('');
            setShowImport(false);
          };

          const updateStatus = async (id, newStatus) => {
            const updated = outboundData.map(item => item.id === id ? { ...item, status: newStatus } : item);
            setOutboundData(updated);
            await syncOutboundToSheet(updated);
            showMessage(`Status diperbarui menjadi ${newStatus}.`);
          };

          // --- Derived Data & Calculations ---
          const totalPages = Math.ceil(outboundData.length / ITEMS_PER_PAGE);
          const paginatedOutbound = outboundData.slice((currentPage - 1) * ITEMS_PER_PAGE, currentPage * ITEMS_PER_PAGE);

          const filteredReportData = useMemo(() => {
            return outboundData.filter(d => {
              if (!d.waktuScan) return false;
              const datePart = d.waktuScan.split(' ')[0];
              const [y, m] = datePart.split('-').map(Number);
              
              let isMatch = false;
              if (reportType === 'harian') {
                isMatch = datePart === reportDate;
              } else if (reportType === 'mingguan') {
                isMatch = (m - 1) === reportMonth && y === reportYear && Number(d.week) === Number(reportWeek);
              } else {
                isMatch = (m - 1) === reportMonth && y === reportYear;
              }
              
              if(activeTab === 'report-tech') {
                  return isMatch && d.namaTeknisi === reportTech;
              }
              return isMatch;
            });
          }, [outboundData, reportType, reportDate, reportMonth, reportYear, reportWeek, reportTech, activeTab]);

          const reportAdminStats = useMemo(() => {
            const stats = {};
            // Initialize structures
            ITEMS.forEach(i => stats[i] = { total: 0, install: 0, belum: 0, return: 0, unit: 'Unit' });
            CABLE_ITEMS.forEach(c => stats[c] = { total: 0, install: 0, belum: 0, return: 0, unit: 'Pcs' });
            
            filteredReportData.forEach(d => {
              const itemName = d.namaBarang === 'Kabel Precon' ? d.kabelPrecon : d.namaBarang;
              const itemQty = d.qty || 1;
              const itemUnit = d.unit || (d.namaBarang === 'Kabel Precon' ? 'Pcs' : 'Unit');

              if (!stats[itemName]) stats[itemName] = { total: 0, install: 0, belum: 0, return: 0, unit: itemUnit };
              
              stats[itemName].total += itemQty;
              if (d.status === 'INSTALL') stats[itemName].install += itemQty;
              else if (d.status === 'RETURN') stats[itemName].return += itemQty;
              else stats[itemName].belum += itemQty;
            });
            return stats;
          }, [filteredReportData]);

          const cableStockSummary = useMemo(() => {
            const summary = {};
            CABLE_ITEMS.forEach(item => {
              const totalMasuk = cableStockInbound.filter(c => c.item === item).reduce((sum, cur) => sum + cur.qty, 0);
              const totalKeluar = outboundData.filter(d => d.kabelPrecon === item).reduce((sum, cur) => sum + (cur.qty || 0), 0);
              summary[item] = { masuk: totalMasuk, keluar: totalKeluar, sisa: totalMasuk - totalKeluar };
            });
            return summary;
          }, [cableStockInbound, outboundData]);

          const deviceStockSummary = useMemo(() => {
            const summary = {};
            
            // 1. Inisialisasi daftar item bawaan agar tetap tampil (meski 0)
            ITEMS.forEach(item => {
              summary[item] = 0;
            });

            // 2. Kalkulasi dinamis berdasarkan item apa saja yang benar-benar ada di Master Data
            masterData.forEach(d => {
              // Hapus spasi berlebih dan buat huruf besar agar perhitungannya akurat
              const itemName = d.item ? d.item.toString().trim().toUpperCase() : 'UNKNOWN';
              
              if (summary[itemName] !== undefined) {
                summary[itemName] += 1;
              } else {
                summary[itemName] = 1;
              }
            });

            // 3. Ubah objek menjadi array lalu urutkan: Stok terbanyak di atas, lalu berdasarkan abjad
            return Object.entries(summary).sort((a, b) => {
               if (b[1] !== a[1]) return b[1] - a[1]; // Urutkan berdasarkan stok (desc)
               return a[0].localeCompare(b[0]);       // Urutkan berdasarkan nama (asc)
            });
          }, [masterData]);

          // --- Exports ---
          const exportToExcel = () => {
            const exportRows = filteredReportData.map((d, index) => ({
              "No": index + 1,
              "Waktu Scan": d.waktuScan,
              "Teknisi": d.namaTeknisi,
              "Serial Number (SN)": d.sn,
              "Nama Barang": d.namaBarang,
              "Kabel Precon": d.kabelPrecon,
              "No WO / Keterangan": d.keterangan,
              "Status Instalasi": d.status
            }));

            const worksheet = XLSX.utils.json_to_sheet(exportRows);
            const workbook = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(workbook, worksheet, "Laporan Inventory");
            
            // Auto-size columns slightly
            const wscols = [ {wch:5}, {wch:20}, {wch:20}, {wch:25}, {wch:20}, {wch:35}, {wch:20}, {wch:15} ];
            worksheet['!cols'] = wscols;

            XLSX.writeFile(workbook, `Laporan_${reportType.toUpperCase()}_${new Date().toISOString().split('T')[0]}.xlsx`);
            showMessage('Berhasil mendownload file Excel!');
          };

          const exportToPDF = () => { window.print(); };

          // --- Views ---
          if (!scriptUrl) {
            return (
              <div className="min-h-screen bg-slate-900 flex items-center justify-center p-4">
                <form onSubmit={saveUrl} className="bg-white p-8 rounded-3xl max-w-md w-full shadow-2xl space-y-6">
                  <div className="text-center">
                      <div className="bg-blue-100 w-16 h-16 rounded-full flex items-center justify-center mx-auto mb-4 text-blue-600">
                          <IconLayers />
                      </div>
                      <h2 className="text-2xl font-black text-slate-800">Hubungkan Database</h2>
                      <p className="text-sm text-slate-500 mt-2">Sistem Inventory Gudang Berbasis Google Sheet</p>
                  </div>
                  <div className="space-y-2">
                    <label className="text-xs font-bold text-slate-700 uppercase tracking-wide">URL Web App Apps Script</label>
                    <input 
                        type="text" 
                        value={tempUrl} 
                        onChange={e => setTempUrl(e.target.value)} 
                        placeholder="https://script.google.com/macros/s/.../exec" 
                        className="w-full border-2 border-slate-200 rounded-xl p-3 text-sm outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-200 transition font-mono bg-slate-50"
                        required
                    />
                  </div>
                  <button type="submit" className="w-full py-3 bg-blue-600 hover:bg-blue-700 text-white rounded-xl font-bold shadow-lg shadow-blue-600/30 transition-all active:scale-[0.98]">
                      Simpan & Mulai
                  </button>
                </form>
              </div>
            );
          }

          return (
            <div className="min-h-screen bg-slate-100 p-4 md:p-8 font-sans text-slate-900 relative">
              
              {/* Custom Confirmation Modal Overlay */}
              {confirmModal && (
                  <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm modal-overlay">
                      <div className="bg-white rounded-3xl shadow-2xl p-6 md:p-8 max-w-sm w-full">
                          <IconAlertCircle />
                          <h3 className="text-xl font-black text-center text-slate-800 mb-2">{confirmModal.title}</h3>
                          <p className="text-center text-slate-600 text-sm mb-6">{confirmModal.message}</p>
                          <div className="flex gap-3">
                              <button onClick={() => setConfirmModal(null)} className="flex-1 py-3 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold rounded-xl transition">Batal</button>
                              <button onClick={confirmDeleteOutbound} className="flex-1 py-3 bg-red-600 hover:bg-red-700 text-white font-bold rounded-xl transition shadow-lg shadow-red-600/30">Hapus</button>
                          </div>
                      </div>
                  </div>
              )}

              <div className="max-w-7xl mx-auto space-y-6">
                
                {/* Header Section */}
                <header className="bg-blue-800 rounded-3xl p-6 md:p-8 text-white shadow-xl shadow-blue-900/10 flex flex-col md:flex-row justify-between items-center gap-4 no-print relative overflow-hidden">
                  <div className="absolute top-0 right-0 opacity-10 pointer-events-none transform translate-x-1/4 -translate-y-1/4">
                      <svg width="200" height="200" viewBox="0 0 24 24" fill="currentColor"><path d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"/></svg>
                  </div>
                  <div className="relative z-10 text-center md:text-left">
                    <h1 className="text-3xl font-black tracking-tight flex items-center justify-center md:justify-start gap-3">
                        <span className="bg-white/20 p-2 rounded-xl backdrop-blur-sm"><IconPackage /></span> 
                        Inventory Tracker
                    </h1>
                    <p className="text-blue-200 mt-2 font-medium text-sm md:text-base">Sinkronisasi Real-time Database Gudang & Lapangan</p>
                  </div>
                  <div className="flex gap-3 items-center relative z-10">
                    <button onClick={fetchData} className="bg-white/10 backdrop-blur-sm px-4 py-2.5 rounded-xl text-sm font-bold border border-white/20 flex items-center gap-2 hover:bg-white/20 transition shadow-sm">
                      <span className={isLoading ? 'animate-spin' : ''}>🔄</span> {isLoading ? 'Memuat...' : 'Sinkronkan'}
                    </button>
                    <button onClick={() => { localStorage.removeItem('gs_url'); setScriptUrl(''); }} className="text-blue-200 hover:text-white px-3 py-2.5 rounded-xl text-sm font-bold transition hover:bg-white/10">
                        Putus Koneksi
                    </button>
                  </div>
                </header>

                {/* Toast Notification */}
                {toast && (
                  <div className={`fixed top-6 left-1/2 -translate-x-1/2 z-50 px-6 py-3 rounded-full shadow-xl text-sm font-bold text-white transition-all transform duration-300 translate-y-0 ${toast.type === 'error' ? 'bg-red-600 shadow-red-600/30' : 'bg-emerald-600 shadow-emerald-600/30'}`}>
                    {toast.msg}
                  </div>
                )}

                {/* Navigation Tabs */}
                <nav className="flex flex-wrap gap-2 p-1.5 bg-white/50 backdrop-blur-sm border border-slate-200 rounded-2xl no-print shadow-sm">
                  {[
                    { id: 'dashboard', label: 'Dashboard Utama', icon: IconDashboard },
                    { id: 'scan', label: 'Barang Keluar & Scan', icon: IconExchange },
                    { id: 'master', label: 'Master Data SN', icon: IconPackage },
                    { id: 'cable-stock', label: 'Database Kabel', icon: IconLayers },
                    { id: 'report-admin', label: 'Laporan Admin', icon: IconChart },
                    { id: 'report-tech', label: 'Laporan Teknisi', icon: IconUsers },
                  ].map(tab => (
                    <button 
                        key={tab.id} 
                        onClick={() => setActiveTab(tab.id)} 
                        className={`flex items-center px-4 py-3 rounded-xl text-sm font-bold transition-all flex-1 justify-center gap-2 min-w-[140px]
                            ${activeTab === tab.id ? 'bg-white text-blue-700 shadow-md ring-1 ring-slate-900/5' : 'text-slate-500 hover:bg-white/60 hover:text-slate-800'}`}
                    >
                      <tab.icon /> <span className="hidden sm:inline">{tab.label}</span>
                    </button>
                  ))}
                </nav>

                <main className="space-y-6 print-container">
                  
                  {}
                  {activeTab === 'dashboard' && (
                    <div className="space-y-6 animate-in fade-in slide-in-from-bottom-4 duration-500">
                      
                      {/* Hero Section */}
                      <div className="bg-gradient-to-br from-indigo-600 via-blue-700 to-blue-800 text-white p-8 md:p-10 rounded-[2rem] shadow-xl flex flex-col md:flex-row justify-between items-center gap-8 relative overflow-hidden">
                        <div className="absolute inset-0 bg-[url('data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iMjAiIGhlaWdodD0iMjAiIHhtbG5zPSJodHRwOi8vd3d3LnczLm9yZy8yMDAwL3N2ZyI+PGNpcmNsZSBjeD0iMiIgY3k9IjIiIHI9IjIiIGZpbGw9IiNmZmZmZmYiIGZpbGwtb3BhY2l0eT0iMC4wNSIvPjwvc3ZnPg==')] opacity-50"></div>
                        <div className="relative z-10 text-center md:text-left">
                          <h2 className="text-3xl md:text-4xl font-black tracking-tight mb-2">Pantau Gudang Cerdas</h2>
                          <p className="text-blue-100 font-medium max-w-xl text-lg opacity-90">Sistem terintegrasi pemantauan material IKR & FTTH secara real-time untuk efisiensi maksimal.</p>
                        </div>
                        <div className="relative z-10 w-full md:w-auto">
                          <button onClick={() => setActiveTab('scan')} className="w-full md:w-auto bg-white text-blue-800 font-bold px-8 py-4 rounded-2xl shadow-xl hover:shadow-2xl hover:bg-slate-50 transition-all hover:-translate-y-1 flex items-center justify-center gap-2">
                              <IconExchange /> Mulai Proses Scan
                          </button>
                        </div>
                      </div>

                      {/* KPI Cards */}
                      <div className="grid grid-cols-2 md:grid-cols-4 gap-4 md:gap-6">
                        <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 hover:shadow-md transition">
                          <div className="w-10 h-10 rounded-xl bg-blue-100 text-blue-600 flex items-center justify-center mb-3"><IconPackage /></div>
                          <p className="text-xs font-bold text-slate-400 uppercase tracking-wider">Stok Master Ready</p>
                          <p className="text-3xl font-black text-slate-800 mt-1">{masterData.length} <span className="text-sm font-medium text-slate-400">Unit</span></p>
                        </div>
                        <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 hover:shadow-md transition">
                          <div className="w-10 h-10 rounded-xl bg-indigo-100 text-indigo-600 flex items-center justify-center mb-3"><IconExchange /></div>
                          <p className="text-xs font-bold text-slate-400 uppercase tracking-wider">Total Keluar</p>
                          <p className="text-3xl font-black text-slate-800 mt-1">{outboundData.length} <span className="text-sm font-medium text-slate-400">Item</span></p>
                        </div>
                        <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 hover:shadow-md transition">
                          <div className="w-10 h-10 rounded-xl bg-emerald-100 text-emerald-600 flex items-center justify-center mb-3"><svg className="w-5 h-5" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M5 13l4 4L19 7"/></svg></div>
                          <p className="text-xs font-bold text-slate-400 uppercase tracking-wider">Status Terpasang</p>
                          <p className="text-3xl font-black text-slate-800 mt-1">{outboundData.filter(d => d.status === 'INSTALL').length} <span className="text-sm font-medium text-slate-400">Item</span></p>
                        </div>
                        <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 hover:shadow-md transition">
                          <div className="w-10 h-10 rounded-xl bg-amber-100 text-amber-600 flex items-center justify-center mb-3"><IconAlertCircle /></div>
                          <p className="text-xs font-bold text-slate-400 uppercase tracking-wider">Belum / Return</p>
                          <p className="text-3xl font-black text-slate-800 mt-1">{outboundData.filter(d => d.status !== 'INSTALL').length} <span className="text-sm font-medium text-slate-400">Item</span></p>
                        </div>
                      </div>

                      {/* Detail Widgets (Side by Side) */}
                      <div className="grid md:grid-cols-2 gap-6 mb-6">
                        {/* Device Stock Alert */}
                        <div className="bg-white rounded-3xl shadow-sm border border-slate-100 p-6 md:p-8 flex flex-col h-[400px]">
                          <h3 className="font-black text-lg text-slate-800 flex items-center gap-3 mb-6"><div className="p-2 bg-slate-100 rounded-lg"><IconPackage /></div> Pantauan Stok Perangkat</h3>
                          <div className="space-y-4 overflow-y-auto pr-2 custom-scrollbar flex-1">
                            {deviceStockSummary.map(([item, stock]) => {
                                const isLow = stock <= 5 && stock > 0;
                                const isEmpty = stock <= 0;
                                
                                return (
                                <div key={item} className={`p-4 rounded-2xl border transition-colors ${isEmpty ? 'bg-red-50 border-red-100' : isLow ? 'bg-amber-50 border-amber-100' : 'bg-slate-50 border-slate-100'}`}>
                                    <div className="flex justify-between items-start mb-2">
                                        <p className={`font-bold text-sm line-clamp-2 pr-4 ${isEmpty ? 'text-red-900' : isLow ? 'text-amber-900' : 'text-slate-800'}`}>{item}</p>
                                        <span className={`shrink-0 px-3 py-1 rounded-full text-xs font-black ${isEmpty ? 'bg-red-100 text-red-700' : isLow ? 'bg-amber-100 text-amber-700' : 'bg-white text-slate-600 shadow-sm'}`}>
                                            {stock} Unit
                                        </span>
                                    </div>
                                    <div className="w-full bg-black/5 rounded-full h-1.5 mt-2 overflow-hidden">
                                        <div className={`h-1.5 rounded-full ${isEmpty ? 'bg-red-500 w-full' : isLow ? 'bg-amber-400 w-1/4' : 'bg-blue-400 w-3/4'}`}></div>
                                    </div>
                                </div>
                                )
                            })}
                          </div>
                        </div>

                        {/* Cable Stock Alert */}
                         <div className="bg-white rounded-3xl shadow-sm border border-slate-100 p-6 md:p-8 flex flex-col h-[400px]">
                          <h3 className="font-black text-lg text-slate-800 flex items-center gap-3 mb-6"><div className="p-2 bg-slate-100 rounded-lg"><IconLayers /></div> Pantauan Stok Kabel</h3>
                          <div className="space-y-4 overflow-y-auto pr-2 custom-scrollbar flex-1">
                            {CABLE_ITEMS.map(item => {
                                const stat = cableStockSummary[item] || { sisa: 0 };
                                const isLow = stat.sisa <= 10 && stat.sisa > 0;
                                const isEmpty = stat.sisa <= 0;
                                
                                return (
                                <div key={item} className={`p-4 rounded-2xl border transition-colors ${isEmpty ? 'bg-red-50 border-red-100' : isLow ? 'bg-amber-50 border-amber-100' : 'bg-slate-50 border-slate-100'}`}>
                                    <div className="flex justify-between items-start mb-2">
                                        <p className={`font-bold text-sm line-clamp-2 pr-4 ${isEmpty ? 'text-red-900' : isLow ? 'text-amber-900' : 'text-slate-800'}`}>{item}</p>
                                        <span className={`shrink-0 px-3 py-1 rounded-full text-xs font-black ${isEmpty ? 'bg-red-100 text-red-700' : isLow ? 'bg-amber-100 text-amber-700' : 'bg-white text-slate-600 shadow-sm'}`}>
                                            {stat.sisa} Pcs
                                        </span>
                                    </div>
                                    <div className="w-full bg-black/5 rounded-full h-1.5 mt-2 overflow-hidden">
                                        <div className={`h-1.5 rounded-full ${isEmpty ? 'bg-red-500 w-full' : isLow ? 'bg-amber-400 w-1/4' : 'bg-emerald-400 w-3/4'}`}></div>
                                    </div>
                                </div>
                                )
                            })}
                          </div>
                        </div>
                      </div>

                      {/* Recent Activity (Full width) */}
                      <div className="bg-white rounded-3xl shadow-sm border border-slate-100 p-6 md:p-8 flex flex-col">
                        <h3 className="font-black text-lg text-slate-800 flex items-center gap-3 mb-6"><div className="p-2 bg-slate-100 rounded-lg"><IconExchange /></div> Aktivitas Barang Keluar Terbaru</h3>
                        <div className="space-y-4">
                          {outboundData.slice(0, 8).map(d => (
                            <div key={d.id} className="flex flex-col sm:flex-row justify-between sm:items-center p-4 bg-slate-50 rounded-2xl border border-slate-100 hover:shadow-sm transition gap-4">
                              <div className="flex gap-4 items-center">
                                  <div className={`w-3 h-3 rounded-full shrink-0 ${d.status === 'INSTALL' ? 'bg-emerald-500 shadow-emerald-500/50' : d.status === 'RETURN' ? 'bg-red-500 shadow-red-500/50' : 'bg-amber-500 shadow-amber-500/50'} shadow-sm`}></div>
                                  <div>
                                      <p className="font-bold text-sm text-slate-800">{d.namaBarang} {d.kabelPrecon !== '-' ? <span className="text-slate-500 font-medium ml-1">({d.kabelPrecon})</span> : ''}</p>
                                      <p className="text-xs text-slate-500 mt-1">
                                        Teknisi: <span className="font-bold text-slate-700">{d.namaTeknisi}</span> • <span className="font-mono">{d.waktuScan}</span>
                                      </p>
                                  </div>
                              </div>
                              <span className={`px-4 py-2 text-center rounded-xl text-xs font-black tracking-widest uppercase ${d.status === 'INSTALL' ? 'bg-emerald-100 text-emerald-800' : d.status === 'RETURN' ? 'bg-red-100 text-red-800' : 'bg-amber-100 text-amber-800'}`}>
                                {d.status}
                              </span>
                            </div>
                          ))}
                          {outboundData.length === 0 && (
                              <div className="flex flex-col items-center justify-center p-8 text-slate-400">
                                  <IconSearch />
                                  <p className="text-sm mt-2 font-medium">Belum ada aktivitas terekam hari ini.</p>
                              </div>
                          )}
                        </div>
                      </div>
                    </div>
                  )}

                  {activeTab === 'scan' && (
                    <div className="space-y-6 animate-in fade-in slide-in-from-bottom-4 duration-500">
                      <div className="grid md:grid-cols-2 gap-6">
                        
                        {/* Device Scanner */}
                        <form onSubmit={handleScan} className="bg-white p-6 md:p-8 rounded-3xl shadow-sm border border-slate-100 space-y-6 relative overflow-hidden">
                          <div className="absolute top-0 right-0 w-32 h-32 bg-blue-50 rounded-bl-[100px] -z-0"></div>
                          
                          <div className="relative z-10">
                              <h3 className="font-black text-2xl flex items-center gap-3 text-slate-800"><div className="p-2 bg-blue-100 text-blue-600 rounded-xl"><IconExchange /></div> Scan Perangkat</h3>
                              <p className="text-slate-500 text-sm mt-1">Keluarkan ONT/STB dari Master Data ke Teknisi.</p>
                          </div>
                          
                          <div className="space-y-4 relative z-10">
                              <div>
                                <label className="block text-xs font-bold text-slate-600 uppercase tracking-wider mb-2">Penugasan Teknisi</label>
                                <select value={selectedTech} onChange={e => setSelectedTech(e.target.value)} className="w-full border-2 border-slate-200 rounded-xl p-3.5 text-sm focus:border-blue-500 focus:ring-4 focus:ring-blue-500/10 outline-none font-bold bg-slate-50 transition cursor-pointer">
                                  {TECHNICIANS.map(t => <option key={t} value={t}>{t}</option>)}
                                </select>
                              </div>
                              
                              <div>
                                <label className="block text-xs font-bold text-slate-600 uppercase tracking-wider mb-2">Scan Barcode / SN</label>
                                <input type="text" value={scanSn} onChange={e => setScanSn(e.target.value)} autoFocus placeholder="Arahkan scanner ke sini..." className="w-full border-2 border-slate-200 rounded-xl p-4 text-base focus:border-blue-500 focus:ring-4 focus:ring-blue-500/10 outline-none font-mono font-bold bg-slate-50 transition placeholder:font-sans placeholder:font-normal"/>
                              </div>
                          </div>
                          
                          <button type="submit" className="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 rounded-xl transition shadow-lg shadow-blue-600/30 relative z-10 text-lg">Proses & Tugaskan</button>
                        </form>

                        {/* Manual Cable Entry */}
                        <form onSubmit={handleManualAdd} className="bg-white p-6 md:p-8 rounded-3xl shadow-sm border border-slate-100 space-y-6 relative overflow-hidden">
                          <div className="absolute top-0 right-0 w-32 h-32 bg-indigo-50 rounded-bl-[100px] -z-0"></div>
                          
                          <div className="relative z-10">
                              <h3 className="font-black text-2xl flex items-center gap-3 text-slate-800"><div className="p-2 bg-indigo-100 text-indigo-600 rounded-xl"><IconPlus /></div> Input Manual Kabel</h3>
                              <p className="text-slate-500 text-sm mt-1">Catat pengeluaran kabel Precon ke Teknisi.</p>
                          </div>
                          
                          <div className="space-y-4 relative z-10">
                              <div>
                                <label className="block text-xs font-bold text-slate-600 uppercase tracking-wider mb-2">Pilih Item Kabel</label>
                                <select value={manualItem} onChange={e => setManualItem(e.target.value)} className="w-full border-2 border-slate-200 rounded-xl p-3.5 text-xs sm:text-sm focus:border-indigo-500 focus:ring-4 focus:ring-indigo-500/10 outline-none font-bold bg-slate-50 transition cursor-pointer">
                                  {CABLE_ITEMS.map(i => <option key={i} value={i}>{i}</option>)}
                                </select>
                              </div>
                              
                              <div>
                                <label className="block text-xs font-bold text-slate-600 uppercase tracking-wider mb-2">Jumlah Keluar (Pcs)</label>
                                <input type="number" min="1" value={manualQty} onChange={e => setManualQty(e.target.value)} placeholder="Contoh: 2" className="w-full border-2 border-slate-200 rounded-xl p-4 text-base focus:border-indigo-500 focus:ring-4 focus:ring-indigo-500/10 outline-none font-mono font-bold bg-slate-50 transition placeholder:font-sans placeholder:font-normal"/>
                              </div>
                          </div>
                          
                          <button type="submit" className="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-4 rounded-xl transition shadow-lg shadow-indigo-600/30 relative z-10 text-lg">Catat Pengeluaran</button>
                        </form>
                      </div>

                      {/* History Table */}
                      <div className="bg-white rounded-3xl shadow-sm border border-slate-100 overflow-hidden">
                        <div className="p-6 border-b flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 bg-slate-50/50">

                            </div>

                                  <td className="p-4 border-r text-center font-black text-amber-700 bg-amber-50/50 text-lg">{s.belum}</td>
                                  <td className="p-4 text-center font-black text-red-700 bg-red-50/50 text-lg">{s.return}</td>
                                </tr>
                              ))}
                              {Object.entries(reportAdminStats).filter(([_, s]) => s.total > 0).length === 0 && (
                                <tr>
                                    <td colSpan="6" className="p-12 text-center text-slate-400">
                                        <div className="flex flex-col items-center justify-center">
                                            <IconChart />
                                            <p className="mt-2 font-medium">Tidak ada data transaksi untuk periode ini.</p>
                                        </div>
                                    </td>
                                </tr>
                              )}
                            </tbody>
                          </table>
                        </div>
                        )}
                      </div>

                      {/* Detailed Log Table */}
                      <div className="bg-white rounded-3xl shadow-sm border border-slate-100 overflow-hidden print-container">
                        <div className="p-5 bg-slate-50 border-b flex justify-between items-center">
                          <h4 className="font-black text-slate-800">Rincian Log Transaksi</h4>
                          <span className="text-xs bg-slate-200 text-slate-700 px-3 py-1 rounded-full font-bold">{filteredReportData.length} Data Ditemukan</span>
                        </div>
                        <div className="overflow-x-auto max-h-[500px] custom-scrollbar">
                          <table className="w-full text-left text-sm whitespace-nowrap">
                            <thead className="bg-white text-slate-500 font-bold sticky top-0 shadow-sm z-10 text-xs uppercase tracking-wider border-b">
                              <tr>
                                <th className="p-4 pl-6">Waktu Transaksi</th>
                                {activeTab === 'report-admin' && <th className="p-4">Teknisi Bertugas</th>}
                                <th className="p-4">Detail Item (SN)</th>
                                <th className="p-4">Material Kabel</th>
                                <th className="p-4">Status & Keterangan</th>
                              </tr>
                            </thead>
                            <tbody className="divide-y divide-slate-100">
                              {filteredReportData.map(d => (
                                <tr key={d.id} className="hover:bg-slate-50/80 transition-colors">
                                  <td className="p-4 pl-6">
                                      <div className="font-mono text-slate-600 font-medium">{d.waktuScan.split(' ')[0]}</div>
                                      <div className="text-xs text-slate-400 font-mono">{d.waktuScan.split(' ')[1]}</div>
                                  </td>
                                  {activeTab === 'report-admin' && <td className="p-4 font-black text-slate-700">{d.namaTeknisi}</td>}
                                  <td className="p-4">
                                    <div className="font-bold text-blue-700 bg-blue-50 inline-block px-2 py-0.5 rounded text-xs mb-1">{d.sn !== '-' ? d.sn : d.namaBarang}</div>
                                    <div className="text-xs text-slate-500">{d.namaBarang !== 'Kabel Precon' ? d.namaBarang : ''}</div>
                                  </td>
                                  <td className="p-4 text-xs font-medium text-slate-600">{d.kabelPrecon !== '-' ? d.kabelPrecon : '-'}</td>
                                  <td className="p-4">
                                    <div className="text-xs text-slate-500 mb-2 max-w-[200px] truncate" title={d.keterangan}>{d.keterangan}</div>
                                    <select 
                                        value={d.status} 
                                        onChange={(e) => updateStatus(d.id, e.target.value)} 
                                        className={`text-[10px] font-black tracking-wider uppercase rounded-lg px-2 py-1 outline-none border cursor-pointer
                                            ${d.status === 'INSTALL' ? 'bg-emerald-50 text-emerald-700 border-emerald-200' : 
                                              d.status === 'RETURN' ? 'bg-red-50 text-red-700 border-red-200' : 
                                              'bg-amber-50 text-amber-700 border-amber-200'}`}
                                    >
                                      <option value="BELUM">BELUM</option>
                                      <option value="INSTALL">INSTALL</option>
                                      <option value="RETURN">RETURN</option>
                                    </select>
                                  </td>
                                </tr>
                              ))}
                              {filteredReportData.length === 0 && (
                                  <tr>
                                      <td colSpan={activeTab === 'report-admin' ? 5 : 4} className="p-12 text-center text-slate-400">
                                          Tidak ada log transaksi detail.
                                      </td>
                                  </tr>
                              )}
                            </tbody>
                          </table>
                        </div>
                      </div>

                    </div>
                  )}

                </main>
              </div>
            </div>
          );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
