<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Inventory Gudang</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
</head>
<body class="bg-slate-100 min-h-screen text-slate-900 font-sans text-sm">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useMemo, useEffect } = React;
        const ITEMS = ['ONT ZTE', 'ONT HUAWEI', 'STB ZTE', 'STB NAVICOM', 'STB TRANSVISION', 'STB HOMATIC', 'STB FIBERHOME'];
        const TECHNICIANS = ['PUTRA-SONY', 'EKO-RIYAN', 'NADI-PARI', 'ARIP', 'NOVAN-GOBY', 'PERI-ROBIN', 'TEDI-DODI', 'DODi-DANIEL-TEDI', 'RAHMAN-FAJAR', 'IQBAL-ARDI', 'RIO-ARI', 'AGUS'];
        const CABLE_ITEMS = ['DTFIBER - CABLE PRECON SC/UPC-SC/APC - 75MTR', 'DTFIBER - CABLE PRECON SC/UPC-SC/APC - 125MTR', 'DTFIBER - CABLE PRECON SC/UPC-SC/APC - 175MTR', 'DTFIBER - CABLE PRECON SC/UPC-SC/APC - 225MTR', 'DTFIBER - CABLE PRECON SC/UPC-SC/APC - 300MTR'];

        function App() {
            const [scriptUrl, setScriptUrl] = useState(() => localStorage.getItem('gs_url') || '');
            const [activeTab, setActiveTab] = useState('dashboard');
            const [masterData, setMasterData] = useState([]);
            const [outboundData, setOutboundData] = useState([]);
            const [cableStockInbound, setCableStockInbound] = useState([]);
            const [currentPage, setCurrentPage] = useState(1);
            const ITEMS_PER_PAGE = 50;

            const fetchData = async () => {
                if (!scriptUrl) return;
                try {
                    const res = await fetch(scriptUrl);
                    const json = await res.json();
                    if(json.master) setMasterData(json.master.slice(1).map(r => ({item: r[0], sn: r[1], code: r[2]})));
                    if(json.outbound) setOutboundData(json.outbound.slice(1).map(r => ({id: r[0], waktuScan: r[1], namaTeknisi: r[2], sn: r[3], namaBarang: r[4], kabelPrecon: r[5], keterangan: r[6], status: r[7]})));
                    if(json.cables) setCableStockInbound(json.cables.slice(1).map(r => ({id: r[0], item: r[1], qty: Number(r[2])})));
                } catch(e) { console.error("Error fetching"); }
            };

            useEffect(() => { if (scriptUrl) fetchData(); }, [scriptUrl]);

            const totalPages = Math.ceil(outboundData.length / ITEMS_PER_PAGE);
            const paginatedOutbound = outboundData.slice((currentPage - 1) * ITEMS_PER_PAGE, currentPage * ITEMS_PER_PAGE);

            const handleDelete = async (id) => {
                if(!confirm("Hapus data ini?")) return;
                const newData = outboundData.filter(d => d.id !== id);
                setOutboundData(newData);
                await fetch(scriptUrl, { method: 'POST', body: JSON.stringify({ type: "saveOutbound", rows: [["ID", "Waktu", "Teknisi", "SN", "Barang", "Kabel", "Ket", "Status"], ...newData.map(d => [d.id, d.waktuScan, d.namaTeknisi, d.sn, d.namaBarang, d.kabelPrecon, d.keterangan, d.status])] }) });
            };

            if (!scriptUrl) return <div className="p-10 text-center"><h2 className="font-bold">Masukkan URL di LocalStorage</h2><input className="border p-2 mt-2 w-full max-w-sm" onChange={(e)=>setScriptUrl(e.target.value)} /><button className="bg-blue-600 text-white p-2 mt-2" onClick={()=>localStorage.setItem('gs_url', scriptUrl) || window.location.reload()}>Simpan</button></div>;

            return (
                <div className="p-4 max-w-7xl mx-auto">
                    <div className="flex gap-2 mb-4 bg-white p-2 rounded-lg shadow-sm overflow-x-auto">
                        {['dashboard', 'scan', 'master', 'report-admin'].map(tab => (
                            <button key={tab} onClick={() => setActiveTab(tab)} className={`px-4 py-2 rounded-md font-bold whitespace-nowrap ${activeTab === tab ? 'bg-blue-600 text-white' : 'hover:bg-slate-100'}`}>
                                {tab.toUpperCase()}
                            </button>
                        ))}
                        <button onClick={fetchData} className="ml-auto bg-slate-800 text-white px-4 py-2 rounded-md font-bold text-xs">Sync Data</button>
                    </div>

                    {activeTab === 'dashboard' && <div className="text-center p-10 font-bold">Dashboard tersedia (Kode sudah dikembalikan)</div>}
                    
                    {activeTab === 'scan' && (
                        <div className="bg-white p-4 rounded-xl shadow-sm border">
                            <h2 className="font-bold text-lg mb-4">Riwayat Barang Keluar ({outboundData.length})</h2>
                            <div className="overflow-hidden">
                                <table className="w-full table-fixed border-collapse text-xs md:text-sm">
                                    <thead>
                                        <tr className="bg-slate-50 text-left">
                                            <th className="p-2 w-20 truncate">Teknisi</th>
                                            <th className="p-2 w-24 truncate">SN / Ket</th>
                                            <th className="p-2 w-auto truncate">Barang</th>
                                            <th className="p-2 w-16 text-center">Aksi</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        {paginatedOutbound.map(d => (
                                            <tr key={d.id} className="border-b hover:bg-slate-50">
                                                <td className="p-2 truncate font-bold">{d.namaTeknisi}</td>
                                                <td className="p-2 truncate font-mono text-[10px]">{d.sn !== '-' ? d.sn : d.keterangan}</td>
                                                <td className="p-2 truncate">{d.namaBarang} {d.kabelPrecon !== '-' ? `(${d.kabelPrecon})` : ''}</td>
                                                <td className="p-2 text-center"><button onClick={() => handleDelete(d.id)} className="text-red-600 font-bold hover:bg-red-50 p-1 rounded">🗑️</button></td>
                                            </tr>
                                        ))}
                                    </tbody>
                                </table>
                            </div>
                            <div className="mt-4 flex justify-center gap-2">
                                <button disabled={currentPage === 1} onClick={() => setCurrentPage(p => Math.max(1, p-1))} className="px-3 py-1 bg-slate-200 rounded disabled:opacity-50">Prev</button>
                                <span className="font-bold p-1">{currentPage} / {totalPages || 1}</span>
                                <button disabled={currentPage >= totalPages} onClick={() => setCurrentPage(p => Math.min(totalPages, p+1))} className="px-3 py-1 bg-slate-200 rounded disabled:opacity-50">Next</button>
                            </div>
                        </div>
                    )}
                </div>
            );
        }
        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
