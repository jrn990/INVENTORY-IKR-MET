                          {showImport && isAdminUnlocked && (
                            <div className="bg-white p-6 md:p-8 rounded-3xl shadow-lg shadow-blue-900/5 border border-blue-100 space-y-4 animate-in slide-in-from-top-4">
                              <div className="flex justify-between items-center mb-2">
                                <h4 className="font-black text-lg text-slate-800 flex items-center gap-2"><IconUnlock /> Area Admin: Paste Data SN</h4>
                                <span className="text-xs font-bold text-blue-600 bg-blue-50 px-3 py-1 rounded-full">Copy dari Excel/Spreadsheet</span>
                              </div>
                              
                              <div className="bg-slate-50 rounded-xl p-4 border text-xs text-slate-600 font-mono space-y-1">
                                  <p className="font-bold font-sans text-slate-700 mb-2">Format yang didukung (Pilih salah satu format kolom):</p>
                                  <p><span className="text-slate-400">1 Kolom:</span> <span className="text-blue-700">Serial_Number</span></p>
                                  <p><span className="text-slate-400">2 Kolom:</span> Nama_Item [Tab] <span className="text-blue-700">Serial_Number</span></p>
                                  <p><span className="text-slate-400">3 Kolom:</span> Nama_Item [Tab] <span className="text-blue-700">Serial_Number</span> [Tab] Kode_Box</p>
                              </div>
                              
                              <textarea 
                                  value={importData} 
                                  onChange={e => setImportData(e.target.value)} 
                                  rows="8" 
                                  className="w-full border-2 border-slate-200 rounded-xl p-4 text-sm focus:border-blue-500 focus:ring-4 focus:ring-blue-500/10 outline-none font-mono bg-white resize-y" 
                                  placeholder="Contoh Paste:&#10;ZTEG12345678&#10;ZTEG87654321"
                              ></textarea>
                              
                              <button onClick={handleBulkImport} className="w-full bg-slate-900 hover:bg-black text-white font-bold py-4 rounded-xl transition shadow-lg text-lg">Mulai Proses Import</button>
                            </div>
                          )}

                          {/* Data Table */}
                          <div className="bg-white rounded-3xl shadow-sm border border-slate-100 overflow-hidden">
                            <div className="overflow-x-auto max-h-[600px] custom-scrollbar">
                              <table className="w-full text-left text-sm whitespace-nowrap">
                                <thead className="bg-slate-50 text-slate-500 font-bold sticky top-0 z-10 text-xs uppercase tracking-wider shadow-sm">
                                  <tr>
                                    <th className="p-5 pl-8 border-b border-slate-200">No</th>
                                    <th className="p-5 border-b border-slate-200">Kategori Item</th>
                                    <th className="p-5 border-b border-slate-200">Serial Number (SN)</th>
                                    <th className="p-5 pr-8 border-b border-slate-200">Kode / Box</th>
                                  </tr>
                                </thead>
                                <tbody className="divide-y divide-slate-100">
                                  {masterData.map((d, i) => (
                                    <tr key={i} className="hover:bg-blue-50/50 transition-colors">
                                      <td className="p-5 pl-8 text-slate-400 font-mono text-xs">{i + 1}</td>
                                      <td className="p-5 font-bold text-slate-700">{d.item}</td>
                                      <td className="p-5 font-mono font-bold text-blue-700">
                                          <span className="bg-blue-50 px-3 py-1 rounded-lg border border-blue-100 select-all">{d.sn}</span>
                                      </td>
                                      <td className="p-5 pr-8 text-slate-500 font-medium">{d.code}</td>
                                    </tr>
                                  ))}
                                  {masterData.length === 0 && (
                                      <tr>
                                          <td colSpan="4" className="p-16 text-center text-slate-400">
                                              <div className="flex flex-col items-center justify-center">
                                                  <IconPackage />
                                                  <p className="mt-4 font-bold text-lg text-slate-600">Gudang Kosong</p>
                                                  <p className="mt-1 text-sm">Data Master belum diisi. Silakan Buka Akses dan gunakan fitur Import.</p>
                                              </div>
                                          </td>
                                      </tr>
                                  )}
                                </tbody>
                              </table>
                            </div>
                          </div>
                        </div>
                      )}

                      {}
                      {activeTab === 'cable-stock' && (
                        <div className="space-y-6 animate-in fade-in duration-300">
                          <div className="grid md:grid-cols-2 gap-6">
                            
                            {/* Stock Summary Widget */}
                            <div className="bg-white rounded-3xl shadow-sm border border-slate-100 p-6 md:p-8 flex flex-col h-full">
                               <h3 className="font-black text-2xl flex items-center gap-3 text-slate-800 mb-6"><div className="p-2 bg-emerald-100 text-emerald-600 rounded-xl"><IconLayers /></div> Pantauan Fisik Kabel</h3>
                               
                               <div className="space-y-4 flex-1 overflow-y-auto pr-2 custom-scrollbar">
                                  {CABLE_ITEMS.map(item => {
                                    const stat = cableStockSummary[item] || { masuk: 0, keluar: 0, sisa: 0 };
                                    const isLow = stat.sisa <= 10 && stat.sisa > 0;
                                    const isEmpty = stat.sisa <= 0;

                                    return (
                                      <div key={item} className="bg-slate-50/50 border border-slate-200 p-5 rounded-2xl transition hover:shadow-md hover:bg-white">
                                        <p className="font-bold text-sm text-slate-800 mb-4 truncate" title={item}>{item}</p>
                                        <div className="grid grid-cols-3 gap-3 text-center text-xs font-black uppercase tracking-wider">
                                          <div className="bg-blue-50 text-blue-700 py-3 rounded-xl border border-blue-100">
                                              <span className="block text-[10px] text-blue-400 mb-1">Masuk</span>
                                              <span className="text-lg">{stat.masuk}</span>
                                          </div>
                                          <div className="bg-orange-50 text-orange-700 py-3 rounded-xl border border-orange-100">
                                              <span className="block text-[10px] text-orange-400 mb-1">Keluar</span>
                                              <span className="text-lg">{stat.keluar}</span>
                                          </div>
                                          <div className={`py-3 rounded-xl border flex flex-col justify-center ${isEmpty ? 'bg-red-50 text-red-700 border-red-200 shadow-inner' : isLow ? 'bg-amber-50 text-amber-700 border-amber-200' : 'bg-emerald-50 text-emerald-700 border-emerald-200 shadow-sm'}`}>
                                              <span className={`block text-[10px] mb-1 ${isEmpty ? 'text-red-400' : isLow ? 'text-amber-500' : 'text-emerald-500'}`}>Sisa Stok</span>
                                              <span className="text-xl">{stat.sisa}</span>
                                          </div>
                                        </div>
                                      </div>
                                    )
                                  })}
                               </div>
                            </div>

                            {/* Inbound Form */}
                            <div className="bg-white p-6 md:p-8 rounded-3xl shadow-sm border border-slate-100 space-y-6 relative overflow-hidden h-fit">
                              <div className="absolute top-0 right-0 w-32 h-32 bg-emerald-50 rounded-bl-[100px] -z-0"></div>
                              
                              <div className="relative z-10 flex justify-between items-start">
                                  <div>
                                      <h3 className="font-black text-2xl flex items-center gap-3 text-slate-800"><div className="p-2 bg-emerald-100 text-emerald-600 rounded-xl"><IconPlus /></div> Restock Kabel Masuk</h3>
                                      <p className="text-slate-500 text-sm mt-1">Catat penerimaan material kabel baru dari pusat.</p>
                                  </div>
                                  {isAdminUnlocked && (
                                      <button onClick={handleLockAdmin} className="bg-red-50 text-red-600 hover:bg-red-100 font-bold p-3 rounded-xl transition shadow-sm" title="Kunci Akses">
                                          <IconLock />
                                      </button>
                                  )}
                              </div>
                              
                              {!isAdminUnlocked ? (
                                  <div className="relative z-10 bg-slate-50 border-2 border-dashed border-slate-200 rounded-2xl p-8 flex flex-col items-center justify-center text-center mt-6">
                                      <div className="w-16 h-16 bg-slate-200 text-slate-500 rounded-full flex items-center justify-center mb-4">
                                          <IconLock />
                                      </div>
                                      <h4 className="font-black text-slate-700 mb-2">Area Terkunci</h4>
                                      <p className="text-sm text-slate-500 mb-6 max-w-xs">Hanya admin yang dapat mencatat material masuk.</p>
                                      <button onClick={() => setPasswordModal(true)} className="bg-slate-800 hover:bg-slate-900 text-white font-bold px-6 py-3 rounded-xl shadow-lg transition">Buka Akses Input</button>
                                  </div>
                              ) : (
                                  <form onSubmit={handleAddCableInbound} className="space-y-4 relative z-10 mt-6 animate-in fade-in">
                                      <div>
                                        <label className="block text-xs font-bold text-slate-600 uppercase tracking-wider mb-2">Pilih Item Material</label>
                                        <select value={newCableItem} onChange={e => setNewCableItem(e.target.value)} className="w-full border-2 border-slate-200 rounded-xl p-3.5 text-xs sm:text-sm focus:border-emerald-500 focus:ring-4 focus:ring-emerald-500/10 outline-none font-bold bg-slate-50 transition cursor-pointer">
                                          {CABLE_ITEMS.map(i => <option key={i} value={i}>{i}</option>)}
                                        </select>
                                      </div>
                                      
                                      <div>
                                        <label className="block text-xs font-bold text-slate-600 uppercase tracking-wider mb-2">Jumlah Diterima (Pcs)</label>
                                        <input type="number" min="1" value={newCableQty} onChange={e => setNewCableQty(e.target.value)} placeholder="Masukkan angka bulat..." className="w-full border-2 border-slate-200 rounded-xl p-4 text-base focus:border-emerald-500 focus:ring-4 focus:ring-emerald-500/10 outline-none font-mono font-bold bg-slate-50 transition placeholder:font-sans placeholder:font-normal"/>
                                      </div>
                                      
                                      <button type="submit" className="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-4 rounded-xl transition shadow-lg shadow-emerald-600/30 relative z-10 text-lg flex justify-center gap-2 items-center"><IconUnlock /> Simpan ke Database Stok</button>
                                  </form>
                              )}
                            </div>
                          </div>
                        </div>
                      )}

                      {}
                      {(activeTab === 'report-admin' || activeTab === 'report-tech') && (
                        <div className="space-y-6 animate-in fade-in duration-300">
                          
                          {/* Filter Controls */}
                          <div className="bg-white p-6 md:p-8 rounded-3xl shadow-sm border border-slate-100 space-y-6 no-print">
                            <div className="flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                              <h3 className="font-black text-2xl flex items-center gap-3 text-slate-800">
                                <div className="p-2 bg-slate-100 text-slate-700 rounded-xl">
                                    {activeTab === 'report-admin' ? <IconChart /> : <IconUsers />}
                                </div> 
                                Pusat Laporan {activeTab === 'report-admin' ? 'Global Gudang' : 'Kinerja Teknisi'}
                              </h3>
                              <div className="flex gap-3 w-full md:w-auto">
                                <button onClick={exportToExcel} className="flex-1 md:flex-none bg-emerald-600 hover:bg-emerald-700 text-white px-6 py-2.5 rounded-xl text-sm font-bold transition shadow-md shadow-emerald-600/20 flex items-center justify-center gap-2">
                                    <svg className="w-4 h-4" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/></svg> Unduh Excel
                                </button>
                                <button onClick={exportToPDF} className="flex-1 md:flex-none bg-slate-800 hover:bg-slate-900 text-white px-6 py-2.5 rounded-xl text-sm font-bold transition shadow-md flex items-center justify-center gap-2">
                                    <IconPrinter /> Cetak PDF
                                </button>
                              </div>
                            </div>

                            <div className="grid grid-cols-1 md:grid-cols-4 gap-4 bg-slate-50 p-4 rounded-2xl border border-slate-100">
                              <div>
                                  <label className="block text-[10px] font-bold text-slate-500 uppercase tracking-wider mb-1 px-1">Periode</label>
                                  <select value={reportType} onChange={e => setReportType(e.target.value)} className="w-full bg-white border-2 border-slate-200 rounded-xl p-2.5 text-sm font-bold outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-500/10 cursor-pointer">
                                    <option value="harian">Harian</option>
                                    <option value="mingguan">Mingguan</option>
                                    <option value="bulanan">Bulanan</option>
                                  </select>
                              </div>
                              
                              {reportType === 'harian' && (
                                  <div>
                                      <label className="block text-[10px] font-bold text-slate-500 uppercase tracking-wider mb-1 px-1">Tanggal</label>
                                      <input type="date" value={reportDate} onChange={e => setReportDate(e.target.value)} className="w-full bg-white border-2 border-slate-200 rounded-xl p-2.5 text-sm font-bold outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-500/10"/>
                                  </div>
                              )}
                              
                              {(reportType === 'mingguan' || reportType === 'bulanan') && (
                                <>
                                  <div>
                                      <label className="block text-[10px] font-bold text-slate-500 uppercase tracking-wider mb-1 px-1">Bulan</label>
                                      <select value={reportMonth} onChange={e => setReportMonth(Number(e.target.value))} className="w-full bg-white border-2 border-slate-200 rounded-xl p-2.5 text-sm font-bold outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-500/10 cursor-pointer">
                                        {MONTHS.map((m, i) => <option key={i} value={i}>{m}</option>)}
                                      </select>
                                  </div>
                                  <div>
                                      <label className="block text-[10px] font-bold text-slate-500 uppercase tracking-wider mb-1 px-1">Tahun</label>
                                      <select value={reportYear} onChange={e => setReportYear(Number(e.target.value))} className="w-full bg-white border-2 border-slate-200 rounded-xl p-2.5 text-sm font-bold outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-500/10 cursor-pointer">
                                        {[2023, 2024, 2025, 2026, 2027].map(y => <option key={y} value={y}>{y}</option>)}
                                      </select>
                                  </div>
                                </>
                              )}
                              
                              {reportType === 'mingguan' && (
                                <div>
                                    <label className="block text-[10px] font-bold text-slate-500 uppercase tracking-wider mb-1 px-1">Pekan</label>
                                    <select value={reportWeek} onChange={e => setReportWeek(Number(e.target.value))} className="w-full bg-white border-2 border-slate-200 rounded-xl p-2.5 text-sm font-bold outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-500/10 cursor-pointer">
                                      {[1, 2, 3, 4, 5].map(w => <option key={w} value={w}>Minggu ke-{w}</option>)}
                                    </select>
                                </div>
                              )}

                              {activeTab === 'report-tech' && (
                                <div className="md:col-span-full">
                                    <label className="block text-[10px] font-bold text-slate-500 uppercase tracking-wider mb-1 px-1">Target Teknisi</label>
                                    <select value={reportTech} onChange={e => setReportTech(e.target.value)} className="w-full bg-white border-2 border-slate-200 rounded-xl p-3 text-sm font-bold outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-500/10 cursor-pointer">
                                      {TECHNICIANS.map(t => <option key={t} value={t}>{t}</option>)}
                                    </select>
                                </div>
                              )}
                            </div>
                          </div>

                          {/* Collapsible Summary Table */}
                          <div className="bg-white rounded-3xl shadow-sm border border-slate-100 mb-6 print-container break-inside-avoid">
                            <div className="p-6 md:p-8 flex flex-col items-center border-b border-slate-100 relative">
                                <h4 className="font-black text-2xl uppercase tracking-widest text-slate-800 text-center">
                                Ringkasan {activeTab === 'report-admin' ? 'Global Gudang' : `Kinerja Teknisi: ${reportTech}`}
                                </h4>
                                <p className="text-sm font-medium text-slate-500 mt-2 bg-slate-50 inline-block px-4 py-1.5 rounded-full border mb-4">
                                    Periode: <span className="font-bold text-slate-700">{reportType === 'harian' ? reportDate : reportType === 'mingguan' ? `Minggu ${reportWeek}, ${MONTHS[reportMonth]} ${reportYear}` : `${MONTHS[reportMonth]} ${reportYear}`}</span>
                                </p>
                                
                                <button 
                                    onClick={() => setShowSummaryTable(!showSummaryTable)} 
                                    className="no-print absolute bottom-0 translate-y-1/2 bg-blue-100 hover:bg-blue-200 text-blue-700 font-bold px-6 py-2 rounded-full shadow-sm border border-blue-200 flex items-center gap-2 transition"
                                >
                                    <IconEye /> {showSummaryTable ? 'Sembunyikan Tabel Ringkasan' : 'Tampilkan Tabel Ringkasan'}
                                </button>
                            </div>
                            
                            {showSummaryTable && (
                                <div className="overflow-x-auto rounded-b-3xl animate-in slide-in-from-top-4 p-4">
                                  <table className="w-full text-sm text-left border rounded-xl overflow-hidden">
                                    <thead className="bg-slate-50 border-b">
                                      <tr>
                                        <th className="p-4 border-r text-xs font-black uppercase tracking-wider text-slate-500">Nama Barang / Material</th>
                                        <th className="p-4 border-r text-center text-xs font-black uppercase tracking-wider text-slate-500 w-24">Satuan</th>
                                        <th className="p-4 border-r text-center text-xs font-black uppercase tracking-wider text-slate-800 bg-slate-100 w-32">Total Keluar</th>
                                        <th className="p-4 border-r text-center text-xs font-black uppercase tracking-wider text-emerald-800 bg-emerald-100 w-32">Terpasang</th>
                                        <th className="p-4 border-r text-center text-xs font-black uppercase tracking-wider text-amber-800 bg-amber-100 w-32">Pending</th>
                                        <th className="p-4 text-center text-xs font-black uppercase tracking-wider text-red-800 bg-red-100 w-32">Return</th>
                                      </tr>
                                    </thead>
                                    <tbody className="divide-y">
                                      {Object.entries(reportAdminStats).filter(([_, s]) => s.total > 0).map(([item, s]) => (
                                        <tr key={item} className="hover:bg-slate-50 transition-colors">
                                          <td className="p-4 border-r font-bold text-slate-700 text-xs">{item}</td>
                                          <td className="p-4 border-r text-center text-xs font-medium text-slate-500">{s.unit}</td>
                                          <td className="p-4 border-r text-center font-black text-lg bg-slate-50/50">{s.total}</td>
                                          <td className="p-4 border-r text-center font-black text-emerald-700 bg-emerald-50/50 text-lg">{s.install}</td>
                                          <td className="p-4 border-r text-center font-black text-amber-700 bg-amber-50/50 text-lg">{s.belum}</td>
                                          <td className="p-4 text-center font-black text-red-700 bg-red-50/50 text-lg">{s.return}</td>
                                        </tr>
                                      ))}
                                      {Object.entries(reportAdminStats).filter(([_, s]) => s.total > 0).length === 0 && (
                                        <tr>
                                            <td colSpan="6" className="p-12 text-center text-slate-400">
                                                <div className="flex flex-col items-center justify-center">
                                                    <IconChart />
                                                    <p className="mt-2 font-medium">Tidak ada data transaksi untuk periode ini.</p>
                                                </div>
                                            </td>
                                        </tr>
                                      )}
                                    </tbody>
                                  </table>
                                </div>
                            )}
                          </div>

                          {/* Detailed Log Table */}
                          <div className="bg-white rounded-3xl shadow-sm border border-slate-100 overflow-hidden print-container mt-12">
                            <div className="p-5 bg-slate-50 border-b flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
                              <div className="flex flex-col sm:flex-row items-start sm:items-center gap-4">
                                  <h4 className="font-black text-slate-800">Rincian Log Transaksi</h4>
                                  <div className="flex items-center gap-2 no-print">
                                      <span className="text-[10px] font-bold text-slate-500 uppercase tracking-wider">Filter:</span>
                                      <select 
                                          value={reportStatusFilter} 
                                          onChange={e => setReportStatusFilter(e.target.value)}
                                          className="text-xs font-bold border-2 border-slate-200 rounded-lg px-2 py-1.5 outline-none focus:border-blue-500 cursor-pointer text-slate-700 bg-white shadow-sm"
                                      >
                                          <option value="ALL">Semua Status</option>
                                          <option value="INSTALL">INSTALL</option>
                                          <option value="BELUM">BELUM (Pending)</option>
                                          <option value="RETURN">RETURN</option>
                                      </select>
                                  </div>
                              </div>
                              <span className="text-xs bg-blue-100 text-blue-800 px-3 py-1.5 rounded-full font-bold">{displayedLogData.length} Data Ditampilkan</span>
                            </div>
                            <div className="overflow-x-auto max-h-[500px] custom-scrollbar">
                              <table className="w-full text-left text-sm whitespace-nowrap">
                                <thead className="bg-white text-slate-500 font-bold sticky top-0 shadow-sm z-10 text-xs uppercase tracking-wider border-b">
                                  <tr>
                                    <th className="p-4 pl-6">Waktu Transaksi</th>
                                    {activeTab === 'report-admin' && <th className="p-4">Teknisi Bertugas</th>}
                                    <th className="p-4">Detail Item (SN)</th>
                                    <th className="p-4">Material Kabel</th>
                                    <th className="p-4">Status & Keterangan</th>
                                  </tr>
                                </thead>
                                <tbody className="divide-y divide-slate-100">
                                  {displayedLogData.map(d => (
                                    <tr key={d.id} className="hover:bg-slate-50/80 transition-colors">
                                      <td className="p-4 pl-6">
                                          <div className="font-mono text-slate-600 font-medium">{d.waktuScan.split(/[\sT]/)[0]}</div>
                                          <div className="text-xs text-slate-400 font-mono">{(d.waktuScan.split(/[\sT]/)[1] || '').split('.')[0]}</div>
                                      </td>
                                      {activeTab === 'report-admin' && <td className="p-4 font-black text-slate-700">{d.namaTeknisi}</td>}
                                      <td className="p-4">
                                        <div className="font-bold text-blue-700 bg-blue-50 inline-block px-2 py-0.5 rounded text-xs mb-1">{d.sn !== '-' ? d.sn : d.namaBarang}</div>
                                        <div className="text-xs text-slate-500">{d.namaBarang !== 'Kabel Precon' ? d.namaBarang : ''}</div>
                                      </td>
                                      <td className="p-4 text-xs font-medium text-slate-600">{d.kabelPrecon !== '-' ? d.kabelPrecon : '-'}</td>
                                      <td className="p-4">
                                        <div className="text-xs text-slate-500 mb-2 max-w-[200px] truncate" title={d.keterangan}>{d.keterangan}</div>
                                        <select 
                                            value={d.status} 
                                            onChange={(e) => updateStatus(d.id, e.target.value)} 
                                            className={`text-[10px] font-black tracking-wider uppercase rounded-lg px-2 py-1 outline-none border cursor-pointer
                                                ${d.status === 'INSTALL' ? 'bg-emerald-50 text-emerald-700 border-emerald-200' : 
                                                  d.status === 'RETURN' ? 'bg-red-50 text-red-700 border-red-200' : 
                                                  'bg-amber-50 text-amber-700 border-amber-200'}`}
                                        >
                                          <option value="BELUM">BELUM</option>
                                          <option value="INSTALL">INSTALL</option>
                                          <option value="RETURN">RETURN</option>
                                        </select>
                                      </td>
                                    </tr>
                                  ))}
                                  {displayedLogData.length === 0 && (
                                      <tr>
                                          <td colSpan={activeTab === 'report-admin' ? 5 : 4} className="p-12 text-center text-slate-400">
                                              Tidak ada log transaksi detail yang sesuai dengan filter.
                                          </td>
                                      </tr>
                                  )}
                                </tbody>
                              </table>
                            </div>
                          </div>

                        </div>
                      )}

                    </main>
                  </div>
              </div>
            </div>
          );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
