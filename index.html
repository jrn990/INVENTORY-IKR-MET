<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Inventory Gudang</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <style>
        @media print {
            body { background: white !important; color: black !important; }
            .no-print, header, nav, button { display: none !important; }
            .print-container { width: 100% !important; margin: 0 !important; padding: 0 !important; box-shadow: none !important; border: none !important; }
        }
        /* Custom scrollbar for better aesthetics */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #f1f5f9; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
</head>
<body class="bg-slate-100 min-h-screen text-slate-900 font-sans text-sm">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useMemo, useEffect } = React;

        const ITEMS = ['ONT ZTE', 'ONT HUAWEI', 'STB ZTE', 'STB NAVICOM', 'STB TRANSVISION', 'STB HOMATIC', 'STB FIBERHOME'];
        const TECHNICIANS = ['PUTRA-SONY', 'EKO-RIYAN', 'NADI-PARI', 'ARIP', 'NOVAN-GOBY', 'PERI-ROBIN', 'TEDI-DODI', 'DODi-DANIEL-TEDI', 'RAHMAN-FAJAR', 'IQBAL-ARDI', 'RIO-ARI', 'AGUS'];
        const MONTHS = ['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni', 'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'];
        const CABLE_ITEMS = [
          'DTFIBER - CABLE PRECON SC/UPC-SC/APC - 75MTR',
          'DTFIBER - CABLE PRECON SC/UPC-SC/APC - 125MTR',
          'DTFIBER - CABLE PRECON SC/UPC-SC/APC - 175MTR',
          'DTFIBER - CABLE PRECON SC/UPC-SC/APC - 225MTR',
          'DTFIBER - CABLE PRECON SC/UPC-SC/APC - 300MTR'
        ];

        const IconDashboard = () => <svg className="w-5 h-5 inline" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M4 5a1 1 0 011-1h4a1 1 0 011 1v4a1 1 0 01-1 1H5a1 1 0 01-1-1V5zM14 5a1 1 0 011-1h4a1 1 0 011 1v4a1 1 0 01-1 1h-4a1 1 0 01-1-1V5zM4 15a1 1 0 011-1h4a1 1 0 011 1v4a1 1 0 01-1 1H5a1 1 0 01-1-1v-5zM14 15a1 1 0 011-1h4a1 1 0 011 1v4a1 1 0 01-1 1h-4a1 1 0 01-1-1v-5z"/></svg>;
        const IconPackage = () => <svg className="w-5 h-5 inline" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"/></svg>;
        const IconSearch = () => <svg className="w-5 h-5 inline" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path strokeLinecap="round" strokeLinejoin="round" d="M21 21l-4.35-4.35"/></svg>;
        const IconUsers = () => <svg className="w-5 h-5 inline" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"/></svg>;
        const IconPlus = () => <svg className="w-5 h-5 inline" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M12 4v16m8-8H4"/></svg>;
        const IconUpload = () => <svg className="w-5 h-5 inline" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"/></svg>;
        const IconChart = () => <svg className="w-5 h-5 inline" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M18 20V10M12 20V4M6 20v-6"/></svg>;
        const IconExchange = () => <svg className="w-5 h-5 inline" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M8 7h12m0 0l-4-4m4 4l-4 4m0 6H4m0 0l4 4m-4-4l4-4"/></svg>;
        const IconLayers = () => <svg className="w-5 h-5 inline" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M12 2l10 5-10 5-10-5 10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>;
        const IconClose = () => <svg className="w-6 h-6 inline" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>;
        const IconTrash = () => <svg className="w-5 h-5 inline text-red-500" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>;

        function App() {
          const [scriptUrl, setScriptUrl] = useState(() => localStorage.getItem('gs_url') || '');
          const [tempUrl, setTempUrl] = useState('');
          const [activeTab, setActiveTab] = useState('dashboard');
          
          const [masterData, setMasterData] = useState([]);
          const [outboundData, setOutboundData] = useState([]);
          const [cableStockInbound, setCableStockInbound] = useState([]);
          
          const [selectedTech, setSelectedTech] = useState(TECHNICIANS[0]);
          const [scanSn, setScanSn] = useState('');
          const [manualItem, setManualItem] = useState(CABLE_ITEMS[0]);
          const [manualQty, setManualQty] = useState('');
          const [newCableItem, setNewCableItem] = useState(CABLE_ITEMS[0]);
          const [newCableQty, setNewCableQty] = useState('');
          const [showImport, setShowImport] = useState(false);
          const [importData, setImportData] = useState('');
          
          // Pagination
          const [currentPage, setCurrentPage] = useState(1);
          const ITEMS_PER_PAGE = 50;

          // Report States
          const [reportType, setReportType] = useState('bulanan');
          const [reportDate, setReportDate] = useState(() => new Date().toISOString().split('T')[0]);
          const [reportMonth, setReportMonth] = useState(new Date().getMonth());
          const [reportYear, setReportYear] = useState(new Date().getFullYear());
          const [reportWeek, setReportWeek] = useState(1);
          const [reportTech, setReportTech] = useState(TECHNICIANS[0]);

          const [toast, setToast] = useState(null);
          const [isLoading, setIsLoading] = useState(false);

          const showMessage = (msg, type = 'success') => {
            setToast({ msg, type });
            setTimeout(() => setToast(null), 4000);
          };

          const saveUrl = (e) => {
            e.preventDefault();
            if (!tempUrl.trim()) return;
            localStorage.setItem('gs_url', tempUrl.trim());
            setScriptUrl(tempUrl.trim());
            showMessage('URL Google Sheet berhasil disimpan!');
          };

          const fetchData = async () => {
            if (!scriptUrl) return;
            setIsLoading(true);
            try {
              const res = await fetch(scriptUrl);
              const json = await res.json();
              
              if (json.master && json.master.length > 1) {
                const loadedMaster = json.master.slice(1).map(row => ({
                  item: row[0], sn: row[1], code: row[2], dateAdded: row[3] || new Date().toISOString()
                })).filter(d => d.sn);
                setMasterData(loadedMaster);
              }

              if (json.outbound && json.outbound.length > 1) {
                const loadedOut = json.outbound.slice(1).map(row => ({
                  id: row[0], waktuScan: row[1], namaTeknisi: row[2], sn: row[3], namaBarang: row[4], kabelPrecon: row[5], keterangan: row[6], status: row[7] || 'BELUM', month: Number(row[8]), week: Number(row[9]), qty: Number(row[10]), unit: row[11]
                })).filter(d => d.id);
                setOutboundData(loadedOut);
              }

              if (json.cables && json.cables.length > 1) {
                const loadedCables = json.cables.slice(1).map(row => ({
                  id: row[0], item: row[1], qty: Number(row[2]), date: row[3]
                })).filter(d => d.id);
                setCableStockInbound(loadedCables);
              }
            } catch (err) {
              console.error("Fetch error", err);
              showMessage('Gagal memuat data. Periksa URL Apps Script.', 'error');
            }
            setIsLoading(false);
          };

          useEffect(() => {
            if (scriptUrl) fetchData();
          }, [scriptUrl]);

          const syncMasterToSheet = async (newMaster) => {
            if (!scriptUrl) return;
            const rows = [["Item", "SN", "Code", "DateAdded"]];
            newMaster.forEach(d => rows.push([d.item, d.sn, d.code, d.dateAdded]));
            await fetch(scriptUrl, { method: 'POST', body: JSON.stringify({ type: "saveMaster", rows }) });
          };

          const syncOutboundToSheet = async (newOut) => {
            if (!scriptUrl) return;
            const rows = [["ID", "WaktuScan", "Teknisi", "SN", "Barang", "Kabel", "Ket", "Status", "Month", "Week", "Qty", "Unit"]];
            newOut.forEach(d => rows.push([d.id, d.waktuScan, d.namaTeknisi, d.sn, d.namaBarang, d.kabelPrecon, d.keterangan, d.status, d.month, d.week, d.qty, d.unit]));
            await fetch(scriptUrl, { method: 'POST', body: JSON.stringify({ type: "saveOutbound", rows }) });
          };

          const syncCablesToSheet = async (newCables) => {
            if (!scriptUrl) return;
            const rows = [["ID", "Item", "Qty", "Date"]];
            newCables.forEach(c => rows.push([c.id, c.item, c.qty, c.date]));
            await fetch(scriptUrl, { method: 'POST', body: JSON.stringify({ type: "saveCables", rows }) });
          };

          const handleScan = async (e) => {
            e.preventDefault();
            if (!scanSn.trim()) return;
            const snToFind = scanSn.trim().toUpperCase().replace(/\s+/g, "");

            let foundIndex = masterData.findIndex(d => d.sn.replace(/\s+/g, "") === snToFind);
            if (foundIndex === -1) {
              foundIndex = masterData.findIndex(d => d.sn.replace(/\s+/g, "").includes(snToFind) || snToFind.includes(d.sn.replace(/\s+/g, "")));
            }

            if (foundIndex === -1) {
              showMessage(`SN "${scanSn}" tidak ditemukan di Master Data!`, 'error');
              setScanSn('');
              return;
            }

            const itemData = masterData[foundIndex];
            const now = new Date();
            const newOut = {
              id: Date.now().toString(),
              waktuScan: `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')} ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}:${String(now.getSeconds()).padStart(2,'0')}`,
              namaTeknisi: selectedTech,
              sn: itemData.sn,
              namaBarang: itemData.item,
              kabelPrecon: '-',
              keterangan: itemData.code || '-',
              status: 'BELUM',
              month: now.getMonth(),
              week: Math.ceil((now.getDate() + new Date(now.getFullYear(), now.getMonth(), 1).getDay()) / 7),
              qty: 1,
              unit: 'Unit'
            };

            const updatedMaster = [...masterData];
            updatedMaster.splice(foundIndex, 1);
            const updatedOut = [newOut, ...outboundData];

            setMasterData(updatedMaster);
            setOutboundData(updatedOut);
            
            await syncMasterToSheet(updatedMaster);
            await syncOutboundToSheet(updatedOut);

            showMessage(`Berhasil! ${itemData.item} ditugaskan ke ${selectedTech}.`);
            setScanSn('');
          };

          const handleManualAdd = async (e) => {
            e.preventDefault();
            if (!manualQty || isNaN(manualQty) || Number(manualQty) <= 0) {
              showMessage('Masukkan jumlah Pcs yang valid!', 'error');
              return;
            }

            const qtyToAdd = Number(manualQty);
            const now = new Date();
            const newOutbounds = [];
            const totalOut = outboundData.filter(d => d.kabelPrecon === manualItem).length;

            for (let i = 0; i < qtyToAdd; i++) {
              newOutbounds.push({
                id: `${Date.now()}-${i}-${Math.random()}`,
                waktuScan: `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')} ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}:${String(now.getSeconds()).padStart(2,'0')}`,
                namaTeknisi: selectedTech,
                sn: '-',
                namaBarang: 'Kabel Precon',
                kabelPrecon: manualItem,
                keterangan: `Roll ${totalOut + i + 1}`,
                status: 'BELUM',
                month: now.getMonth(),
                week: Math.ceil((now.getDate() + new Date(now.getFullYear(), now.getMonth(), 1).getDay()) / 7),
                qty: 1,
                unit: 'Pcs'
              });
            }

            const updatedOut = [...newOutbounds, ...outboundData];
            setOutboundData(updatedOut);
            await syncOutboundToSheet(updatedOut);
            showMessage(`Berhasil mencatat ${qtyToAdd} Pcs ${manualItem}.`);
            setManualQty('');
          };

          const handleAddCableInbound = async (e) => {
            e.preventDefault();
            if (!newCableQty || isNaN(newCableQty) || Number(newCableQty) <= 0) return;

            const newEntry = {
              id: Date.now().toString(),
              item: newCableItem,
              qty: Number(newCableQty),
              date: new Date().toISOString()
            };

            const updatedCables = [newEntry, ...cableStockInbound];
            setCableStockInbound(updatedCables);
            await syncCablesToSheet(updatedCables);
            showMessage(`Berhasil menambah stok kabel.`);
            setNewCableQty('');
          };

          const handleDeleteOutbound = async (id) => {
            const itemToDelete = outboundData.find(d => d.id === id);
            if (!itemToDelete) return;

            if (!confirm(`Hapus data barang keluar untuk teknisi ${itemToDelete.namaTeknisi}?`)) return;

            const updatedOutbound = outboundData.filter(d => d.id !== id);
            setOutboundData(updatedOutbound);

            let updatedMaster = [...masterData];
            if (itemToDelete.sn && itemToDelete.sn !== '-') {
              updatedMaster = [{
                item: itemToDelete.namaBarang,
                sn: itemToDelete.sn,
                code: itemToDelete.keterangan !== '-' && !itemToDelete.keterangan.startsWith('Roll') ? itemToDelete.keterangan : '-',
                dateAdded: new Date().toISOString()
              }, ...updatedMaster];
              setMasterData(updatedMaster);
              await syncMasterToSheet(updatedMaster);
            }

            await syncOutboundToSheet(updatedOutbound);
            showMessage('Data berhasil dihapus' + (itemToDelete.sn !== '-' ? ' & SN dikembalikan ke Gudang.' : '.'));
          };

          const handleBulkImport = async () => {
            if (!importData.trim()) return;
            const rows = importData.trim().split('\n');
            let addedCount = 0;
            const newData = [];

            rows.forEach(row => {
              if (!row.trim()) return;
              const cols = row.split(/\t+|\s{2,}/).map(c => c.trim()).filter(Boolean);
              if (cols.length >= 1) {
                let item = 'MATERIAL GUDANG', sn = '', code = '-';
                if (cols.length >= 3) {
                  if (cols[0].toUpperCase().startsWith('DN')) { code = cols[0]; item = cols[1]; sn = cols[2]; }
                  else { item = cols[0]; sn = cols[1]; code = cols[2]; }
                } else if (cols.length === 2) { item = cols[0]; sn = cols[1]; }
                else if (cols.length === 1) { sn = cols[0]; }

                if (sn && sn !== '-') {
                  newData.push({ sn: sn.toUpperCase(), item: item.toUpperCase(), code: code.toUpperCase(), dateAdded: new Date().toISOString() });
                  addedCount++;
                }
              }
            });

            if (newData.length > 0) {
              const updatedMaster = [...newData, ...masterData];
              setMasterData(updatedMaster);
              await syncMasterToSheet(updatedMaster);
              showMessage(`Berhasil import ${addedCount} data SN ke Google Sheet!`);
            } else {
              showMessage('Format data tidak dikenali.', 'error');
            }
            
            setImportData('');
            setShowImport(false);
          };

          const updateStatus = async (id, newStatus) => {
            const updated = outboundData.map(item => item.id === id ? { ...item, status: newStatus } : item);
            setOutboundData(updated);
            await syncOutboundToSheet(updated);
            showMessage(`Status diperbarui menjadi ${newStatus}.`);
          };

          // Pagination Logic
          const totalPages = Math.ceil(outboundData.length / ITEMS_PER_PAGE);
          const paginatedOutbound = outboundData.slice((currentPage - 1) * ITEMS_PER_PAGE, currentPage * ITEMS_PER_PAGE);

          const filteredReportData = useMemo(() => {
            return outboundData.filter(d => {
              if (!d.waktuScan) return false;
              const datePart = d.waktuScan.split(' ')[0];
              const [y, m] = datePart.split('-').map(Number);
              
              let isMatch = false;
              if (reportType === 'harian') {
                isMatch = datePart === reportDate;
              } else if (reportType === 'mingguan') {
                isMatch = (m - 1) === reportMonth && y === reportYear && Number(d.week) === Number(reportWeek);
              } else {
                isMatch = (m - 1) === reportMonth && y === reportYear;
              }
              
              if(activeTab === 'report-tech') {
                  return isMatch && d.namaTeknisi === reportTech;
              }
              return isMatch;
            });
          }, [outboundData, reportType, reportDate, reportMonth, reportYear, reportWeek, reportTech, activeTab]);

          const reportAdminStats = useMemo(() => {
            const stats = {};
            ITEMS.forEach(i => stats[i] = { total: 0, install: 0, belum: 0, return: 0, unit: 'Unit' });
            CABLE_ITEMS.forEach(c => stats[c] = { total: 0, install: 0, belum: 0, return: 0, unit: 'Pcs' });
            
            filteredReportData.forEach(d => {
              const itemName = d.namaBarang === 'Kabel Precon' ? d.kabelPrecon : d.namaBarang;
              const itemQty = d.qty || 1;
              const itemUnit = d.unit || (d.namaBarang === 'Kabel Precon' ? 'Pcs' : 'Unit');

              if (!stats[itemName]) stats[itemName] = { total: 0, install: 0, belum: 0, return: 0, unit: itemUnit };
              
              stats[itemName].total += itemQty;
              if (d.status === 'INSTALL') stats[itemName].install += itemQty;
              else if (d.status === 'RETURN') stats[itemName].return += itemQty;
              else stats[itemName].belum += itemQty;
            });
            return stats;
          }, [filteredReportData]);

          const cableStockSummary = useMemo(() => {
            const summary = {};
            CABLE_ITEMS.forEach(item => {
              const totalMasuk = cableStockInbound.filter(c => c.item === item).reduce((sum, cur) => sum + cur.qty, 0);
              const totalKeluar = outboundData.filter(d => d.kabelPrecon === item).reduce((sum, cur) => sum + (cur.qty || 0), 0);
              summary[item] = { masuk: totalMasuk, keluar: totalKeluar, sisa: totalMasuk - totalKeluar };
            });
            return summary;
          }, [cableStockInbound, outboundData]);

          const exportToExcel = () => {
            const exportRows = filteredReportData.map((d, index) => ({
              No: index + 1,
              "Waktu Scan": d.waktuScan,
              Teknisi: d.namaTeknisi,
              "Serial Number (SN)": d.sn,
              "Nama Barang": d.namaBarang,
              "Kabel Precon": d.kabelPrecon,
              "No WO / Keterangan": d.keterangan,
              "Status Instalasi": d.status
            }));

            const worksheet = XLSX.utils.json_to_sheet(exportRows);
            const workbook = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(workbook, worksheet, "Laporan Inventory");
            XLSX.writeFile(workbook, `Laporan_${reportType.toUpperCase()}_${new Date().toISOString().split('T')[0]}.xlsx`);
            showMessage('Berhasil mendownload file Excel!');
          };

          const exportToPDF = () => { window.print(); };

          if (!scriptUrl) {
            return (
              <div className="min-h-screen bg-slate-900 flex items-center justify-center p-4">
                <form onSubmit={saveUrl} className="bg-white p-8 rounded-3xl max-w-md w-full shadow-2xl space-y-4">
                  <h2 className="text-2xl font-black text-slate-800">Hubungkan ke Google Sheet</h2>
                  <p className="text-sm text-slate-600">Masukkan URL Web App Google Apps Script:</p>
                  <input type="text" value={tempUrl} onChange={e => setTempUrl(e.target.value)} placeholder="https://script.google.com/macros/s/.../exec" className="w-full border-2 border-slate-200 rounded-xl p-3 text-sm outline-none focus:border-blue-500 font-mono"/>
                  <button type="submit" className="w-full py-3 bg-blue-600 hover:bg-blue-700 text-white rounded-xl font-bold">Simpan & Hubungkan</button>
                </form>
              </div>
            );
          }

          return (
            <div className="min-h-screen bg-slate-100 p-4 md:p-8 font-sans text-slate-900">
              <div className="max-w-6xl mx-auto space-y-6">
                
                <header className="bg-blue-800 rounded-3xl p-6 md:p-8 text-white shadow-lg flex flex-col md:flex-row justify-between items-center gap-4 no-print">
                  <div>
                    <h1 className="text-3xl font-black tracking-tight flex items-center gap-3"><IconPackage /> Inventory Google Sheet (Lengkap)</h1>
                    <p className="text-blue-200 mt-2 font-medium">Sinkronisasi Real-time 3 Admin Gudang</p>
                  </div>
                  <div className="flex gap-2 items-center">
                    <button onClick={fetchData} className="bg-blue-900 px-4 py-2 rounded-xl text-sm font-bold border border-blue-700 flex items-center gap-2 hover:bg-blue-700 transition">
                      {isLoading ? 'Memuat...' : '🔄 Sinkronkan'}
                    </button>
                    <button onClick={() => { localStorage.removeItem('gs_url'); setScriptUrl(''); }} className="bg-red-900/60 hover:bg-red-900 px-3 py-2 rounded-xl text-xs font-bold transition">Ganti URL</button>
                  </div>
                </header>

                {toast && (
                  <div className={`fixed top-6 left-1/2 -translate-x-1/2 z-50 px-6 py-3 rounded-full shadow-xl text-sm font-bold text-white transition-opacity duration-300 ${toast.type === 'error' ? 'bg-red-600' : 'bg-emerald-600'}`}>
                    {toast.msg}
                  </div>
                )}

                <div className="flex flex-wrap gap-2 mb-6 p-1 bg-slate-200/50 rounded-xl no-print">
                  {[
                    { id: 'dashboard', label: 'Dashboard Utama', icon: IconDashboard },
                    { id: 'scan', label: 'Barang Keluar & Scan', icon: IconExchange },
                    { id: 'master', label: 'Master Data SN', icon: IconPackage },

                          <h2 className="text-3xl font-black">Selamat Datang di Gudang Inventory!</h2>
                          <p className="text-blue-100 mt-2 font-medium max-w-xl">Sistem pemantauan material IKR & FTTH terintegrasi secara real-time untuk seluruh admin gudang dan teknisi lapangan.</p>
                        </div>
                        <div className="flex flex-col gap-2 w-full md:w-auto">
                          <button onClick={() => setActiveTab('scan')} className="bg-white text-blue-700 font-bold px-6 py-3 rounded-2xl shadow-md hover:bg-blue-50 transition text-center">⚡ Mulai Scan Barang Keluar</button>
                        </div>
                      </div>

                      <div className="grid grid-cols-1 md:grid-cols-4 gap-6">
                        <div className="bg-white p-6 rounded-2xl shadow-sm border border-l-4 border-l-blue-600">

                          <p className="text-3xl font-black text-slate-800 mt-2">{masterData.length} <span className="text-sm font-normal text-slate-500">Unit</span></p>
                        </div>
                        <div className="bg-white p-6 rounded-2xl shadow-sm border border-l-4 border-l-indigo-600">
                          <p className="text-sm font-bold text-slate-500">Total Keluar Gudang</p>

                        <div className="bg-white p-6 rounded-2xl shadow-sm border border-l-4 border-l-amber-500">
                          <p className="text-sm font-bold text-slate-500">Status Belum / Return</p>
                          <p className="text-3xl font-black text-slate-800 mt-2">{outboundData.filter(d => d.status !== 'INSTALL').length} <span className="text-sm font-normal text-slate-500">Item</span></p>
                        </div>
                      </div>

                      <div className="grid md:grid-cols-2 gap-6">
                        <div className="bg-white rounded-2xl shadow-sm border p-6 space-y-4">
                          <h3 className="font-bold text-lg text-slate-800 flex items-center gap-2"><IconExchange /> Aktivitas Barang Keluar Terbaru</h3>
                          <div className="space-y-3">
                            {outboundData.slice(0, 5).map(d => (
                              <div key={d.id} className="flex justify-between items-center p-3 bg-slate-50 rounded-xl border">
                                <div>
                                  <p className="font-bold text-sm text-slate-800">{d.namaBarang} {d.kabelPrecon !== '-' ? `(${d.kabelPrecon})` : ''}</p>
                                  <p className="text-xs text-slate-500 font-mono">Teknisi: {d.namaTeknisi} | {d.waktuScan}</p>
                                </div>
                                <span className={`px-3 py-1 rounded-full text-xs font-bold ${d.status === 'INSTALL' ? 'bg-green-100 text-green-700' : d.status === 'RETURN' ? 'bg-red-100 text-red-700' : 'bg-orange-100 text-orange-700'}`}>
                                  {d.status}
                                </span>
                              </div>
                            ))}
                            {outboundData.length === 0 && <p className="text-sm text-slate-500 text-center py-4">Belum ada aktivitas barang keluar.</p>}
                          </div>
                        </div>
                         <div className="bg-white rounded-2xl shadow-sm border p-6 space-y-4">
                          <h3 className="font-bold text-lg text-slate-800 flex items-center gap-2"><IconLayers /> Stok Kabel Tersedia</h3>
                          <div className="space-y-3">
                            {CABLE_ITEMS.slice(0,5).map(item => {
                                const stat = cableStockSummary[item] || { sisa: 0 };
                                return (
                                <div key={item} className="flex justify-between items-center p-3 bg-slate-50 rounded-xl border">
                                    <p className="font-bold text-sm text-slate-800">{item}</p>
                                    <span className={`px-3 py-1 rounded-full text-xs font-bold ${stat.sisa > 10 ? 'bg-green-100 text-green-700' : stat.sisa > 0 ? 'bg-orange-100 text-orange-700' : 'bg-red-100 text-red-700'}`}>
                                    {stat.sisa} Pcs
                                    </span>
                                </div>
                                )
                            })}
                          </div>
                        </div>
                      </div>
                    </div>
                  )}

                  {}
                  {activeTab === 'scan' && (

                          <h3 className="font-black text-xl flex items-center gap-2"><IconExchange /> Scan ONT / STB Keluar</h3>
                          
                          <div>
                            <label className="block text-sm font-bold text-slate-700 mb-2">Pilih Teknisi</label>
                            <select value={selectedTech} onChange={e => setSelectedTech(e.target.value)} className="w-full border-2 border-slate-200 rounded-xl p-3 text-sm focus:border-blue-500 outline-none font-bold">
                              {TECHNICIANS.map(t => <option key={t} value={t}>{t}</option>)}
                            </select>
                          </div>
                          
                          <div>
                            <label className="block text-sm font-bold text-slate-700 mb-2">Scan Barcode / SN</label>
                            <input type="text" value={scanSn} onChange={e => setScanSn(e.target.value)} autoFocus placeholder="Arahkan kursor & Scan barcode disini..." className="w-full border-2 border-slate-200 rounded-xl p-3 text-sm focus:border-blue-500 outline-none font-mono"/>
                          </div>
                          
                          <button type="submit" className="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-xl transition">Submit & Tugaskan</button>
                        </form>

                        <form onSubmit={handleManualAdd} className="bg-white p-6 rounded-2xl shadow-sm border space-y-4">
                          <h3 className="font-black text-xl flex items-center gap-2"><IconPlus /> Manual Input (Kabel)</h3>
                          
                          <div>
                            <label className="block text-sm font-bold text-slate-700 mb-2">Item Kabel</label>
                            <select value={manualItem} onChange={e => setManualItem(e.target.value)} className="w-full border-2 border-slate-200 rounded-xl p-3 text-sm focus:border-blue-500 outline-none font-bold text-xs">
                              {CABLE_ITEMS.map(i => <option key={i} value={i}>{i}</option>)}
                            </select>
                          </div>
                          
                          <div>
                            <label className="block text-sm font-bold text-slate-700 mb-2">Jumlah (Pcs)</label>
                            <input type="number" min="1" value={manualQty} onChange={e => setManualQty(e.target.value)} placeholder="Contoh: 2" className="w-full border-2 border-slate-200 rounded-xl p-3 text-sm focus:border-blue-500 outline-none font-mono"/>
                          </div>
                          
                          <button type="submit" className="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 rounded-xl transition">Tambahkan Kabel</button>
                        </form>
                      </div>

                      <div className="bg-white rounded-2xl shadow-sm border overflow-hidden">
                        <div className="p-4 bg-slate-50 border-b flex justify-between items-center">
                          <h3 className="font-bold text-lg">History Barang Keluar</h3>
                          <span className="text-xs bg-blue-100 text-blue-800 px-3 py-1 rounded-full font-bold">Total: {outboundData.length}</span>
                        </div>
                        <div className="overflow-x-auto">
                          <table className="w-full text-left text-sm whitespace-nowrap">
                            <thead className="bg-slate-100 text-slate-600 font-bold border-b">
                              <tr>
                                <th className="p-4">Waktu</th>
                                <th className="p-4">Teknisi</th>
                                <th className="p-4">SN / Item</th>
                                <th className="p-4">Kabel</th>
                                <th className="p-4">Status</th>
                                <th className="p-4 text-center">Aksi</th>
                              </tr>
                            </thead>
                            <tbody>
                              {paginatedOutbound.map(d => (
                                <tr key={d.id} className="border-b hover:bg-slate-50 transition">
                                  <td className="p-4 font-mono text-xs">{d.waktuScan}</td>
                                  <td className="p-4 font-bold">{d.namaTeknisi}</td>
                                  <td className="p-4">
                                    <div className="font-bold text-blue-700">{d.sn !== '-' ? d.sn : d.namaBarang}</div>
                                    <div className="text-xs text-slate-500">{d.namaBarang !== 'Kabel Precon' ? d.namaBarang : d.keterangan}</div>
                                  </td>
                                  <td className="p-4 text-xs">{d.kabelPrecon}</td>
                                  <td className="p-4">
                                    <span className={`inline-block px-3 py-1 rounded-full text-xs font-bold border ${d.status === 'INSTALL' ? 'bg-green-100 text-green-700 border-green-200' : d.status === 'RETURN' ? 'bg-red-100 text-red-700 border-red-200' : 'bg-orange-100 text-orange-700 border-orange-200'}`}>
                                      {d.status}
                                    </span>
                                  </td>
                                  <td className="p-4 text-center">
                                    <button onClick={() => handleDeleteOutbound(d.id)} className="text-red-500 hover:bg-red-50 p-2 rounded-lg transition" title="Hapus Data">
                                      <IconTrash />
                                    </button>
                                  </td>
                                </tr>
                              ))}
                              {paginatedOutbound.length === 0 && <tr><td colSpan="6" className="p-8 text-center text-slate-500">Belum ada history.</td></tr>}
                            </tbody>
                          </table>
                        </div>
                        
                        {/* Pagination Controls */}
                        {totalPages > 1 && (
                          <div className="p-4 border-t bg-slate-50 flex justify-between items-center">

                            <span className="text-sm font-bold text-slate-600">Halaman {currentPage} dari {totalPages}</span>
                            <button disabled={currentPage === totalPages} onClick={() => setCurrentPage(p => p + 1)} className="px-4 py-2 bg-white border rounded shadow-sm disabled:opacity-50 text-sm font-bold">Berikutnya</button>
                          </div>
                        )}
                      </div>
                    </div>
                  )}

                  {}
                  {activeTab === 'master' && (
                    <div className="space-y-6">
                      <div className="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 bg-white p-6 rounded-2xl shadow-sm border">
                        <div>
                          <h3 className="font-black text-xl flex items-center gap-2"><IconPackage /> Data Master SN</h3>
                          <p className="text-sm text-slate-500 mt-1">Stok perangkat yang siap ditugaskan ({masterData.length} item)</p>
                        </div>
                        <button onClick={() => setShowImport(!showImport)} className="bg-indigo-100 text-indigo-700 font-bold px-4 py-2 rounded-xl flex items-center gap-2 hover:bg-indigo-200 transition">
                          <IconUpload /> {showImport ? 'Tutup Import' : 'Import Massal'}
                        </button>
                      </div>

                      {showImport && (
                        <div className="bg-white p-6 rounded-2xl shadow-sm border space-y-4">
                          <div className="flex justify-between items-center">
                            <h4 className="font-bold text-lg">Paste Data SN (Excel/Teks)</h4>
                            <button onClick={() => setShowImport(false)} className="text-slate-400 hover:text-slate-600"><IconClose /></button>
                          </div>
                          <p className="text-xs text-slate-500">Format yang didukung (Copy dari Excel lalu Paste ke sini):<br/>- Format 1: <code>SN</code><br/>- Format 2: <code>Item [Tab] SN</code><br/>- Format 3: <code>Item [Tab] SN [Tab] Kode</code></p>
                          <textarea value={importData} onChange={e => setImportData(e.target.value)} rows="6" className="w-full border-2 border-slate-200 rounded-xl p-3 text-sm focus:border-indigo-500 outline-none font-mono" placeholder="ZTEG...&#10;ZTEG..."></textarea>
                          <button onClick={handleBulkImport} className="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 rounded-xl transition">Proses Import</button>
                        </div>
                      )}

                      <div className="bg-white rounded-2xl shadow-sm border overflow-hidden">
                        <div className="overflow-x-auto max-h-[600px]">
                          <table className="w-full text-left text-sm whitespace-nowrap">
                            <thead className="bg-slate-100 text-slate-600 font-bold sticky top-0 shadow-sm z-10">
                              <tr>
                                <th className="p-4">No</th>
                                <th className="p-4">Item</th>
                                <th className="p-4">Serial Number (SN)</th>
                                <th className="p-4">Kode/Keterangan</th>
                              </tr>
                            </thead>
                            <tbody>
                              {masterData.map((d, i) => (
                                <tr key={i} className="border-b hover:bg-slate-50">
                                  <td className="p-4 text-slate-500">{i + 1}</td>
                                  <td className="p-4 font-bold">{d.item}</td>
                                  <td className="p-4 font-mono text-blue-700">{d.sn}</td>
                                  <td className="p-4 text-slate-500">{d.code}</td>
                                </tr>
                              ))}
                              {masterData.length === 0 && <tr><td colSpan="4" className="p-8 text-center text-slate-500">Data Master kosong. Silakan import.</td></tr>}
                            </tbody>
                          </table>
                        </div>
                      </div>
                    </div>
                  )}

                  {}
                  {activeTab === 'cable-stock' && (
                    <div className="space-y-6">
                      <div className="grid md:grid-cols-2 gap-6">
                        <div className="bg-white rounded-2xl shadow-sm border p-6">
                           <h3 className="font-black text-xl flex items-center gap-2 mb-4"><IconLayers /> Ringkasan Stok Kabel</h3>
                           <div className="space-y-3">
                              {CABLE_ITEMS.map(item => {
                                const stat = cableStockSummary[item] || { masuk: 0, keluar: 0, sisa: 0 };
                                return (
                                  <div key={item} className="bg-slate-50 border p-4 rounded-xl">
                                    <p className="font-bold text-sm text-slate-800 mb-2 truncate" title={item}>{item}</p>
                                    <div className="grid grid-cols-3 gap-2 text-center text-xs font-bold">
                                      <div className="bg-blue-100 text-blue-800 p-2 rounded">In: {stat.masuk}</div>
                                      <div className="bg-orange-100 text-orange-800 p-2 rounded">Out: {stat.keluar}</div>
                                      <div className={`p-2 rounded ${stat.sisa > 10 ? 'bg-green-100 text-green-800' : stat.sisa > 0 ? 'bg-amber-100 text-amber-800' : 'bg-red-100 text-red-800'}`}>Sisa: {stat.sisa}</div>
                                    </div>
                                  </div>
                                )
                              })}
                           </div>
                        </div>

                        <form onSubmit={handleAddCableInbound} className="bg-white p-6 rounded-2xl shadow-sm border space-y-4">
                          <h3 className="font-black text-xl flex items-center gap-2"><IconPlus /> Catat Kabel Masuk Gudang</h3>
                          
                          <div>
                            <label className="block text-sm font-bold text-slate-700 mb-2">Item Kabel</label>
                            <select value={newCableItem} onChange={e => setNewCableItem(e.target.value)} className="w-full border-2 border-slate-200 rounded-xl p-3 text-sm focus:border-emerald-500 outline-none font-bold text-xs">
                              {CABLE_ITEMS.map(i => <option key={i} value={i}>{i}</option>)}
                            </select>
                          </div>
                          
                          <div>
                            <label className="block text-sm font-bold text-slate-700 mb-2">Jumlah Tambah (Pcs)</label>
                            <input type="number" min="1" value={newCableQty} onChange={e => setNewCableQty(e.target.value)} placeholder="Contoh: 50" className="w-full border-2 border-slate-200 rounded-xl p-3 text-sm focus:border-emerald-500 outline-none font-mono"/>
                          </div>
                          
                          <button type="submit" className="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 rounded-xl transition">Simpan Stok Masuk</button>
                        </form>
                      </div>
                    </div>
                  )}

                  {}
                  {(activeTab === 'report-admin' || activeTab === 'report-tech') && (
                    <div className="space-y-6">
                      <div className="bg-white p-6 rounded-2xl shadow-sm border space-y-4 no-print">
                        <div className="flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                          <h3 className="font-black text-xl flex items-center gap-2">
                            {activeTab === 'report-admin' ? <IconChart /> : <IconUsers />} 
                            Filter Laporan {activeTab === 'report-admin' ? 'Gudang' : 'Teknisi'}
                          </h3>
                          <div className="flex gap-2">
                            <button onClick={exportToExcel} className="bg-green-600 hover:bg-green-700 text-white px-4 py-2 rounded-xl text-sm font-bold transition">Excel</button>
                            <button onClick={exportToPDF} className="bg-slate-800 hover:bg-slate-900 text-white px-4 py-2 rounded-xl text-sm font-bold transition">PDF/Print</button>
                          </div>
                        </div>

                        <div className="grid grid-cols-1 md:grid-cols-4 gap-4">
                          <select value={reportType} onChange={e => setReportType(e.target.value)} className="border-2 rounded-xl p-2 text-sm font-bold outline-none focus:border-blue-500">
                            <option value="harian">Harian</option>
                            <option value="mingguan">Mingguan</option>
                            <option value="bulanan">Bulanan</option>
                          </select>
                          
                          {reportType === 'harian' && <input type="date" value={reportDate} onChange={e => setReportDate(e.target.value)} className="border-2 rounded-xl p-2 text-sm font-bold outline-none"/>}
                          
                          {(reportType === 'mingguan' || reportType === 'bulanan') && (
                            <>
                              <select value={reportMonth} onChange={e => setReportMonth(Number(e.target.value))} className="border-2 rounded-xl p-2 text-sm font-bold outline-none focus:border-blue-500">
                                {MONTHS.map((m, i) => <option key={i} value={i}>{m}</option>)}
                              </select>
                              <select value={reportYear} onChange={e => setReportYear(Number(e.target.value))} className="border-2 rounded-xl p-2 text-sm font-bold outline-none focus:border-blue-500">
                                {[2023, 2024, 2025, 2026, 2027].map(y => <option key={y} value={y}>{y}</option>)}
                              </select>
                            </>
                          )}
                          
                          {reportType === 'mingguan' && (
                            <select value={reportWeek} onChange={e => setReportWeek(Number(e.target.value))} className="border-2 rounded-xl p-2 text-sm font-bold outline-none focus:border-blue-500">
                              {[1, 2, 3, 4, 5].map(w => <option key={w} value={w}>Minggu ke-{w}</option>)}
                            </select>
                          )}

                          {activeTab === 'report-tech' && (
                            <select value={reportTech} onChange={e => setReportTech(e.target.value)} className="border-2 rounded-xl p-2 text-sm font-bold outline-none focus:border-blue-500">
                              {TECHNICIANS.map(t => <option key={t} value={t}>{t}</option>)}
                            </select>
                          )}
                        </div>
                      </div>

                      <div className="bg-white p-6 rounded-2xl shadow-sm border mb-6 print-container break-inside-avoid">
                        <h4 className="font-bold text-lg mb-4 text-center border-b pb-2 uppercase tracking-wide">
                          Ringkasan {activeTab === 'report-admin' ? 'Total Gudang' : `Teknisi: ${reportTech}`} <br/>
                          <span className="text-sm font-normal text-slate-500 normal-case">Periode: {reportType === 'harian' ? reportDate : reportType === 'mingguan' ? `Minggu ${reportWeek}, ${MONTHS[reportMonth]} ${reportYear}` : `${MONTHS[reportMonth]} ${reportYear}`}</span>
                        </h4>
                        
                        <div className="overflow-x-auto">
                          <table className="w-full text-sm text-left border">
                            <thead className="bg-slate-100 font-bold border-b">
                              <tr>
                                <th className="p-3 border-r">Nama Barang</th>
                                <th className="p-3 border-r text-center">Satuan</th>
                                <th className="p-3 border-r text-center">Keluar Gudang</th>
                                <th className="p-3 border-r text-center text-green-700 bg-green-50">Install</th>
                                <th className="p-3 border-r text-center text-orange-700 bg-orange-50">Belum Install</th>
                                <th className="p-3 text-center text-red-700 bg-red-50">Return</th>
                              </tr>
                            </thead>
                            <tbody>
                              {Object.entries(reportAdminStats).filter(([_, s]) => s.total > 0).map(([item, s]) => (
                                <tr key={item} className="border-b">
                                  <td className="p-3 border-r font-bold text-xs">{item}</td>
                                  <td className="p-3 border-r text-center text-xs">{s.unit}</td>
                                  <td className="p-3 border-r text-center font-bold">{s.total}</td>
                                  <td className="p-3 border-r text-center text-green-700 bg-green-50 font-bold">{s.install}</td>
                                  <td className="p-3 border-r text-center text-orange-700 bg-orange-50 font-bold">{s.belum}</td>
                                  <td className="p-3 text-center text-red-700 bg-red-50 font-bold">{s.return}</td>
                                </tr>
                              ))}
                              {Object.entries(reportAdminStats).filter(([_, s]) => s.total > 0).length === 0 && (
                                <tr><td colSpan="6" className="p-4 text-center text-slate-500">Tidak ada data untuk periode ini.</td></tr>
                              )}
                            </tbody>
                          </table>
                        </div>
                      </div>

                      <div className="bg-white rounded-2xl shadow-sm border overflow-hidden print-container">
                        <div className="p-4 bg-slate-50 border-b">
                          <h4 className="font-bold">Rincian Data ({filteredReportData.length} item)</h4>
                        </div>
                        <div className="overflow-x-auto max-h-[500px]">
                          <table className="w-full text-left text-sm whitespace-nowrap">
                            <thead className="bg-slate-100 text-slate-600 font-bold sticky top-0 shadow-sm z-10">
                              <tr>
                                <th className="p-3">Waktu</th>
                                {activeTab === 'report-admin' && <th className="p-3">Teknisi</th>}
                                <th className="p-3">SN / Barang</th>
                                <th className="p-3">Kabel</th>
                                <th className="p-3">Ket / Status</th>
                              </tr>
                            </thead>
                            <tbody>
                              {filteredReportData.map(d => (
                                <tr key={d.id} className="border-b">
                                  <td className="p-3 font-mono text-xs">{d.waktuScan}</td>
                                  {activeTab === 'report-admin' && <td className="p-3 font-bold">{d.namaTeknisi}</td>}
                                  <td className="p-3">
                                    <div className="font-bold text-blue-700">{d.sn !== '-' ? d.sn : d.namaBarang}</div>
                                    <div className="text-xs text-slate-500">{d.namaBarang !== 'Kabel Precon' ? d.namaBarang : ''}</div>
                                  </td>
                                  <td className="p-3 text-xs">{d.kabelPrecon}</td>
                                  <td className="p-3">
                                    <div className="text-xs text-slate-600 mb-1">{d.keterangan}</div>
                                    <select value={d.status} onChange={(e) => updateStatus(d.id, e.target.value)} className={`text-xs font-bold rounded-lg px-2 py-1 outline-none border cursor-pointer ${d.status === 'INSTALL' ? 'bg-green-100 text-green-700 border-green-200' : d.status === 'RETURN' ? 'bg-red-100 text-red-700 border-red-200' : 'bg-orange-100 text-orange-700 border-orange-200'}`}>
                                      <option value="BELUM">BELUM</option>
                                      <option value="INSTALL">INSTALL</option>
                                      <option value="RETURN">RETURN</option>
                                    </select>
                                  </td>
                                </tr>
                              ))}
                              {filteredReportData.length === 0 && <tr><td colSpan={activeTab === 'report-admin' ? 5 : 4} className="p-8 text-center text-slate-500">Data kosong.</td></tr>}
                            </tbody>
                          </table>
                        </div>
                      </div>

                    </div>
                  )}

                </main>
              </div>
            </div>
          );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
