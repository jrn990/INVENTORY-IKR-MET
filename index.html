<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Inventory Gudang</title>
    
    <!-- Load Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Load React & Babel -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Load SheetJS for Excel export/import -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

    <!-- Load Tone.js for Sound Effects -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>

    <!-- Load Html5-Qrcode for Camera Barcode Scanner -->
    <script src="https://unpkg.com/html5-qrcode"></script>
    
    <style>
        @media print {
            body { background: white !important; color: black !important; margin: 0; padding: 0; }
            .no-print, header, nav, button { display: none !important; }
            .print-container { width: 100% !important; margin: 0 !important; padding: 0 !important; box-shadow: none !important; border: none !important; }
            .print-only { display: block !important; }
        }
        .print-only { display: none; }
        
        /* Custom scrollbar for better aesthetics */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #f1f5f9; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        
        /* Modal animation */
        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.96); }
            to { opacity: 1; transform: scale(1); }
        }
        .modal-overlay {
            animation: fadeIn 0.2s ease-out forwards;
        }

        /* Camera scanner customization */
        #reader { border: none !important; border-radius: 1rem; overflow: hidden; }
        #reader button { background-color: #2563eb; color: white; border: none; padding: 10px 18px; border-radius: 10px; font-weight: bold; cursor: pointer; margin-top: 10px; font-size: 13px;}
        #reader button:hover { background-color: #1d4ed8; }
    </style>
</head>
<body class="bg-slate-100 min-h-screen text-slate-900 font-sans text-sm selection:bg-blue-200 selection:text-blue-900">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useMemo, useEffect } = React;

        const TECHNICIANS = ['PUTRA-SONY', 'EKO-RIYAN', 'NADI-PARI', 'ARIP', 'NOVAN-GOBY', 'PERI-ROBIN', 'TEDI-DODI', 'DODi-DANIEL-TEDI', 'RAHMAN-FAJAR', 'IQBAL-ARDI', 'RIO-ARI', 'AGUS'];
        const MONTHS = ['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni', 'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'];
        const CABLE_ITEMS = [
          'DTFIBER - CABLE PRECON SC/UPC-SC/APC - 75MTR',
          'DTFIBER - CABLE PRECON SC/UPC-SC/APC - 125MTR',
          'DTFIBER - CABLE PRECON SC/UPC-SC/APC - 175MTR',
          'DTFIBER - CABLE PRECON SC/UPC-SC/APC - 225MTR',
          'DTFIBER - CABLE PRECON SC/UPC-SC/APC - 300MTR'
        ];
        const CHART_COLORS = ['#10b981', '#3b82f6', '#f59e0b', '#8b5cf6', '#ec4899', '#06b6d4'];

        // --- SVG Icons ---
        const IconDashboard = () => <svg className="w-5 h-5 inline" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M4 5a1 1 0 011-1h4a1 1 0 011 1v4a1 1 0 01-1 1H5a1 1 0 01-1-1V5zM14 5a1 1 0 011-1h4a1 1 0 011 1v4a1 1 0 01-1 1h-4a1 1 0 01-1-1V5zM4 15a1 1 0 011-1h4a1 1 0 011 1v4a1 1 0 01-1 1H5a1 1 0 01-1-1v-5zM14 15a1 1 0 011-1h4a1 1 0 011 1v4a1 1 0 01-1 1h-4a1 1 0 01-1-1v-5z"/></svg>;
        const IconPackage = () => <svg className="w-5 h-5 inline" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"/></svg>;
        const IconSearch = () => <svg className="w-5 h-5 inline" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path strokeLinecap="round" strokeLinejoin="round" d="M21 21l-4.35-4.35"/></svg>;
        const IconUsers = () => <svg className="w-5 h-5 inline" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"/></svg>;
        const IconPlus = () => <svg className="w-5 h-5 inline" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M12 4v16m8-8H4"/></svg>;
        const IconUpload = () => <svg className="w-5 h-5 inline" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"/></svg>;
        const IconChart = () => <svg className="w-5 h-5 inline" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M18 20V10M12 20V4M6 20v-6"/></svg>;
        const IconExchange = () => <svg className="w-5 h-5 inline" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M8 7h12m0 0l-4-4m4 4l-4 4m0 6H4m0 0l4 4m-4-4l4-4"/></svg>;
        const IconLayers = () => <svg className="w-5 h-5 inline" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M12 2l10 5-10 5-10-5 10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>;
        const IconClose = () => <svg className="w-6 h-6 inline" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>;
        const IconTrash = () => <svg className="w-5 h-5 inline" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>;
        const IconAlertCircle = () => <svg className="w-12 h-12 text-red-500 mb-4 mx-auto" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>;
        const IconLock = () => <svg className="w-5 h-5 inline" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/></svg>;
        const IconUnlock = () => <svg className="w-5 h-5 inline" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M8 11V7a4 4 0 118 0m-4 8v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2z"/></svg>;
        const IconEye = () => <svg className="w-5 h-5 inline" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" /><path strokeLinecap="round" strokeLinejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" /></svg>;
        const IconCamera = () => <svg className="w-5 h-5 inline" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z" /><path strokeLinecap="round" strokeLinejoin="round" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z" /></svg>;
        const IconPrinter = () => <svg className="w-5 h-5 inline" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z" /></svg>;

        // --- Native Custom Bar Chart Component ---
        const CustomBarChart = ({ data }) => {
            if (!data || data.length === 0) {
                return <div className="flex items-center justify-center h-full text-slate-400 text-sm">Belum ada data barang keluar.</div>;
            }

            const maxVal = Math.max(...data.map(d => d.Terpasang + d.Pending + d.Return), 1);

            return (
                <div className="w-full h-full flex flex-col justify-between py-2">
                    <div className="space-y-3 overflow-y-auto max-h-[260px] pr-2 custom-scrollbar">
                        {data.map((item, idx) => {
                            const total = item.Terpasang + item.Pending + item.Return;
                            const pInstall = (item.Terpasang / maxVal) * 100;
                            const pPending = (item.Pending / maxVal) * 100;
                            const pReturn = (item.Return / maxVal) * 100;

                            return (
                                <div key={idx} className="space-y-1">
                                    <div className="flex justify-between items-center text-xs">
                                        <span className="font-bold text-slate-700 truncate max-w-[200px]" title={item.name}>{item.name}</span>
                                        <span className="font-mono text-slate-500 font-bold">{total} Item</span>
                                    </div>
                                    <div className="w-full bg-slate-100 h-3.5 rounded-full overflow-hidden flex">
                                        {item.Terpasang > 0 && (
                                            <div style={{ width: `${pInstall}%` }} className="bg-emerald-500 h-full transition-all duration-500" title={`Terpasang: ${item.Terpasang}`}></div>
                                        )}
                                        {item.Pending > 0 && (
                                            <div style={{ width: `${pPending}%` }} className="bg-amber-400 h-full transition-all duration-500" title={`Pending: ${item.Pending}`}></div>
                                        )}
                                        {item.Return > 0 && (
                                            <div style={{ width: `${pReturn}%` }} className="bg-red-500 h-full transition-all duration-500" title={`Return: ${item.Return}`}></div>
                                        )}
                                    </div>
                                </div>
                            );
                        })}
                    </div>
                    
                    {/* Legend */}
                    <div className="flex justify-center items-center gap-6 pt-3 border-t text-xs font-bold text-slate-600">
                        <div className="flex items-center gap-1.5"><span className="w-3 h-3 rounded-full bg-emerald-500"></span> Terpasang</div>
                        <div className="flex items-center gap-1.5"><span className="w-3 h-3 rounded-full bg-amber-400"></span> Pending</div>
                        <div className="flex items-center gap-1.5"><span className="w-3 h-3 rounded-full bg-red-500"></span> Return</div>
                    </div>
                </div>
            );
        };

        // --- Native Custom Donut Chart Component ---
        const CustomDonutChart = ({ data }) => {
            if (!data || data.length === 0) {
                return <div className="flex items-center justify-center h-full text-slate-400 text-sm">Belum ada perangkat terpasang bulan ini.</div>;
            }

            const totalValue = data.reduce((sum, item) => sum + item.value, 0);
            let cumulativeAngle = 0;

            return (
                <div className="w-full h-full flex flex-col md:flex-row items-center justify-center gap-6">
                    <div className="relative w-44 h-44 shrink-0">
                        <svg viewBox="0 0 100 100" className="w-full h-full transform -rotate-90">
                            {data.map((item, idx) => {
                                const strokeDasharray = `${(item.value / totalValue) * 283} 283`;
                                const strokeDashoffset = -cumulativeAngle;
                                cumulativeAngle += (item.value / totalValue) * 283;
                                const color = CHART_COLORS[idx % CHART_COLORS.length];

                                return (
                                    <circle
                                        key={idx}
                                        cx="50"
                                        cy="50"
                                        r="45"
                                        fill="transparent"
                                        stroke={color}
                                        strokeWidth="10"
                                        strokeDasharray={strokeDasharray}
                                        strokeDashoffset={strokeDashoffset}
                                        className="transition-all duration-700 ease-out"
                                    />
                                );
                            })}
                        </svg>
                        <div className="absolute inset-0 flex flex-col items-center justify-center text-center pointer-events-none">
                            <span className="text-2xl font-black text-slate-800">{totalValue}</span>
                            <span className="text-[10px] font-bold text-slate-400 uppercase tracking-widest">Terpasang</span>
                        </div>
                    </div>

                    <div className="space-y-2 flex-1 w-full max-w-[200px]">
                        {data.map((item, idx) => (
                            <div key={idx} className="flex items-center justify-between text-xs">
                                <div className="flex items-center gap-2 truncate pr-2">
                                    <span className="w-2.5 h-2.5 rounded-full shrink-0" style={{ backgroundColor: CHART_COLORS[idx % CHART_COLORS.length] }}></span>
                                    <span className="font-bold text-slate-700 truncate">{item.name}</span>
                                </div>
                                <span className="font-mono font-bold text-slate-800">{item.value} <span className="text-[10px] text-slate-400">Unit</span></span>
                            </div>
                        ))}
                    </div>
                </div>
            );
        };

        function App() {
          // System State
          const [scriptUrl, setScriptUrl] = useState(() => localStorage.getItem('gs_url') || '');
          const [tempUrl, setTempUrl] = useState('');
          const [activeTab, setActiveTab] = useState('dashboard');
          const [toast, setToast] = useState(null);
          const [isLoading, setIsLoading] = useState(false);
          const [confirmModal, setConfirmModal] = useState(null); 
          const [passwordModal, setPasswordModal] = useState(false);
          const [adminPasswordInput, setAdminPasswordInput] = useState('');
          
          // Camera & Print State
          const [isScannerOpen, setIsScannerOpen] = useState(false);
          const [suratJalanData, setSuratJalanData] = useState(null);
          
          // Security State
          const [isAdminUnlocked, setIsAdminUnlocked] = useState(() => sessionStorage.getItem('admin_unlocked') === 'true');

          // Data State
          const [masterData, setMasterData] = useState([]);
          const [outboundData, setOutboundData] = useState([]);
          const [cableStockInbound, setCableStockInbound] = useState([]);
          
          // Form State
          const [selectedTech, setSelectedTech] = useState(TECHNICIANS[0]);
          const [scanSn, setScanSn] = useState('');
          const [manualItem, setManualItem] = useState(CABLE_ITEMS[0]);
          const [manualQty, setManualQty] = useState('');
          const [newCableItem, setNewCableItem] = useState(CABLE_ITEMS[0]);
          const [newCableQty, setNewCableQty] = useState('');
          const [showImport, setShowImport] = useState(false);
          const [importData, setImportData] = useState('');
          
          // Pagination State
          const [currentPage, setCurrentPage] = useState(1);
          const ITEMS_PER_PAGE = 50;

          // Report Filters State
          const [reportType, setReportType] = useState('bulanan');
          const [reportDate, setReportDate] = useState(() => new Date().toISOString().split('T')[0]);
          const [reportMonth, setReportMonth] = useState(new Date().getMonth());
          const [reportYear, setReportYear] = useState(new Date().getFullYear());
          const [reportWeek, setReportWeek] = useState(1);
          const [reportTech, setReportTech] = useState(TECHNICIANS[0]);
          const [reportStatusFilter, setReportStatusFilter] = useState('ALL');
          
          // UI Toggle States
          const [showSummaryTable, setShowSummaryTable] = useState(false);

          const playSuccessSound = async () => {
            try {
                if (window.Tone) {
                    await Tone.start();
                    // Suara beep scanner digital yang tajam dan singkat (Square Wave)
                    const synth = new Tone.Synth({
                        oscillator: { type: "square" },
                        envelope: { attack: 0.01, decay: 0.1, sustain: 0, release: 0.01 }
                    }).toDestination();
                    synth.volume.value = -15; // Volume disesuaikan agar tidak menyakitkan telinga
                    synth.triggerAttackRelease("C6", "16n");
                }
            } catch(e) { console.log("Audio play prevented", e); }
          };

          const playErrorSound = async () => {
            try {
                if (window.Tone) {
                    await Tone.start();
                    // Suara error "tet-tot" rendah yang tegas (Sawtooth Wave)
                    const synth = new Tone.Synth({
                        oscillator: { type: "sawtooth" },
                        envelope: { attack: 0.01, decay: 0.15, sustain: 0, release: 0.1 }
                    }).toDestination();
                    synth.volume.value = -10;
                    const now = Tone.now();
                    synth.triggerAttackRelease("G2", "16n", now);
                    synth.triggerAttackRelease("G2", "16n", now + 0.15);
                }
            } catch(e) { console.log("Audio play prevented", e); }
          };

          const showMessage = (msg, type = 'success') => {
            setToast({ msg, type });
            setTimeout(() => setToast(null), 4000);
          };

          useEffect(() => {
            let html5QrcodeScanner = null;
            if (isScannerOpen && window.Html5QrcodeScanner) {
                html5QrcodeScanner = new Html5QrcodeScanner("reader", { fps: 10, qrbox: {width: 250, height: 250} }, false);
                html5QrcodeScanner.render(
                    (decodedText) => {
                        setScanSn(decodedText);
                        playSuccessSound();
                        showMessage("Barcode terdeteksi!", "success");
                        setIsScannerOpen(false);
                        if(html5QrcodeScanner) html5QrcodeScanner.clear();
                    },
                    (errorMessage) => {}
                );
            }
            return () => {
                if (html5QrcodeScanner) {
                    html5QrcodeScanner.clear().catch(error => console.error("Failed to clear scanner", error));
                }
            };
          }, [isScannerOpen]);

          const saveUrl = (e) => {
            e.preventDefault();
            if (!tempUrl.trim()) return;
            localStorage.setItem('gs_url', tempUrl.trim());
            setScriptUrl(tempUrl.trim());
            showMessage('URL Google Sheet berhasil disimpan!');
          };

          const fetchData = async () => {
            if (!scriptUrl) return;
            setIsLoading(true);
            try {
              const res = await fetch(scriptUrl);
              const json = await res.json();
              
              if (json.master && json.master.length > 1) {
                const loadedMaster = json.master.slice(1).map(row => ({
                  item: row[0], sn: row[1], code: row[2], dateAdded: row[3] || new Date().toISOString()
                })).filter(d => d.sn);
                setMasterData(loadedMaster);
              }

              if (json.outbound && json.outbound.length > 1) {
                const loadedOut = json.outbound.slice(1).map(row => ({
                  id: row[0], waktuScan: row[1], namaTeknisi: row[2], sn: row[3], namaBarang: row[4], kabelPrecon: row[5], keterangan: row[6], status: row[7] || 'BELUM', month: Number(row[8]), week: Number(row[9]), qty: Number(row[10]), unit: row[11]
                })).filter(d => d.id);
                setOutboundData(loadedOut);
              }

              if (json.cables && json.cables.length > 1) {
                const loadedCables = json.cables.slice(1).map(row => ({
                  id: row[0], item: row[1], qty: Number(row[2]), date: row[3]
                })).filter(d => d.id);
                setCableStockInbound(loadedCables);
              }
            } catch (err) {
              console.error("Fetch error", err);
              showMessage('Gagal memuat data. Periksa URL Apps Script.', 'error');
            }
            setIsLoading(false);
          };

          useEffect(() => {
            if (scriptUrl) fetchData();
          }, [scriptUrl]);

          const syncDataToSheet = async (type, rows) => {
            if (!scriptUrl) return;
            try {
                await fetch(scriptUrl, { method: 'POST', body: JSON.stringify({ type, rows }) });
            } catch (error) {
                console.error("Sync error", error);
                showMessage(`Gagal sinkronisasi data ${type}.`, 'error');
            }
          };

          const syncMasterToSheet = async (newMaster) => {
            const rows = [["Item", "SN", "Code", "DateAdded"]];
            newMaster.forEach(d => rows.push([d.item, d.sn, d.code, d.dateAdded]));
            await syncDataToSheet("saveMaster", rows);
          };

          const syncOutboundToSheet = async (newOut) => {
            const rows = [["ID", "WaktuScan", "Teknisi", "SN", "Barang", "Kabel", "Ket", "Status", "Month", "Week", "Qty", "Unit"]];
            newOut.forEach(d => rows.push([d.id, d.waktuScan, d.namaTeknisi, d.sn, d.namaBarang, d.kabelPrecon, d.keterangan, d.status, d.month, d.week, d.qty, d.unit]));
            await syncDataToSheet("saveOutbound", rows);
          };

          const syncCablesToSheet = async (newCables) => {
            const rows = [["ID", "Item", "Qty", "Date"]];
            newCables.forEach(c => rows.push([c.id, c.item, c.qty, c.date]));
            await syncDataToSheet("saveCables", rows);
          };

          const submitAdminPassword = (e) => {
            e.preventDefault();
            if(adminPasswordInput === 'admin123') {
                sessionStorage.setItem('admin_unlocked', 'true');
                setIsAdminUnlocked(true);
                playSuccessSound();
                showMessage("Akses Admin Berhasil Dibuka!", "success");
                setPasswordModal(false);
            } else {
                playErrorSound();
                showMessage("Password Salah!", "error");
            }
            setAdminPasswordInput('');
          };

          const handleLockAdmin = () => {
            sessionStorage.removeItem('admin_unlocked');
            setIsAdminUnlocked(false);
            setShowImport(false);
            showMessage("Akses Admin Terkunci", "success");
          };

          const handleScan = async (e) => {
            e.preventDefault();
            if (!scanSn.trim()) return;
            const snToFind = scanSn.trim().toUpperCase().replace(/\s+/g, "");

            let foundIndex = masterData.findIndex(d => d.sn.replace(/\s+/g, "") === snToFind);
            if (foundIndex === -1) {
              foundIndex = masterData.findIndex(d => d.sn.replace(/\s+/g, "").includes(snToFind) || snToFind.includes(d.sn.replace(/\s+/g, "")));
            }

            if (foundIndex === -1) {
              playErrorSound();
              showMessage(`SN "${scanSn}" tidak ditemukan di Master Data!`, 'error');
              setScanSn('');
              return;
            }

            const itemData = masterData[foundIndex];
            const now = new Date();
            const newOut = {
              id: Date.now().toString() + Math.random().toString(36).substr(2, 5),
              waktuScan: `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')} ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}:${String(now.getSeconds()).padStart(2,'0')}`,
              namaTeknisi: selectedTech,
              sn: itemData.sn,
              namaBarang: itemData.item,
              kabelPrecon: '-',
              keterangan: itemData.code || '-',
              status: 'BELUM',
              month: now.getMonth(),
              week: Math.ceil((now.getDate() + new Date(now.getFullYear(), now.getMonth(), 1).getDay()) / 7),
              qty: 1,
              unit: 'Unit'
            };

            const updatedMaster = [...masterData];
            updatedMaster.splice(foundIndex, 1);
            const updatedOut = [newOut, ...outboundData];

            setMasterData(updatedMaster);
            setOutboundData(updatedOut);
            
            await syncMasterToSheet(updatedMaster);
            await syncOutboundToSheet(updatedOut);

            playSuccessSound();
            showMessage(`Berhasil! ${itemData.item} ditugaskan ke ${selectedTech}.`);
            setScanSn('');
          };

          const handleManualAdd = async (e) => {
            e.preventDefault();
            if (!manualQty || isNaN(manualQty) || Number(manualQty) <= 0) {
              playErrorSound();
              showMessage('Masukkan jumlah Pcs yang valid!', 'error');
              return;
            }

            const qtyToAdd = Number(manualQty);
            const now = new Date();
            const newOutbounds = [];
            const totalOut = outboundData.filter(d => d.kabelPrecon === manualItem).length;

            for (let i = 0; i < qtyToAdd; i++) {
              newOutbounds.push({
                id: `${Date.now()}-${i}-${Math.random().toString(36).substr(2, 5)}`,
                waktuScan: `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')} ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}:${String(now.getSeconds()).padStart(2,'0')}`,
                namaTeknisi: selectedTech,
                sn: '-',
                namaBarang: 'Kabel Precon',
                kabelPrecon: manualItem,
                keterangan: `Roll ${totalOut + i + 1}`,
                status: 'BELUM',
                month: now.getMonth(),
                week: Math.ceil((now.getDate() + new Date(now.getFullYear(), now.getMonth(), 1).getDay()) / 7),
                qty: 1,
                unit: 'Pcs'
              });
            }

            const updatedOut = [...newOutbounds, ...outboundData];
            setOutboundData(updatedOut);
            await syncOutboundToSheet(updatedOut);
            playSuccessSound();
            showMessage(`Berhasil mencatat ${qtyToAdd} Pcs ${manualItem}.`);
            setManualQty('');
          };

          const handleAddCableInbound = async (e) => {
            e.preventDefault();
            if (!newCableQty || isNaN(newCableQty) || Number(newCableQty) <= 0) return;

            const newEntry = {
              id: Date.now().toString() + Math.random().toString(36).substr(2, 5),
              item: newCableItem,
              qty: Number(newCableQty),
              date: new Date().toISOString()
            };

            const updatedCables = [newEntry, ...cableStockInbound];
            setCableStockInbound(updatedCables);
            await syncCablesToSheet(updatedCables);
            playSuccessSound();
            showMessage(`Berhasil menambah stok kabel.`);
            setNewCableQty('');
          };

          const requestDeleteOutbound = (id) => {
             const item = outboundData.find(d => d.id === id);
             if (item) {
                 setConfirmModal({
                     id,
                     title: 'Hapus Data Keluar',
                     message: `Hapus data barang keluar untuk teknisi ${item.namaTeknisi}? Jika ini memiliki SN, barang akan dikembalikan ke Master Data Gudang.`
                 });
             }
          };

          const confirmDeleteOutbound = async () => {
            if (!confirmModal || !confirmModal.id) return;
            const id = confirmModal.id;
            const itemToDelete = outboundData.find(d => d.id === id);
            
            if (!itemToDelete) {
                setConfirmModal(null);
                return;
            }

            const updatedOutbound = outboundData.filter(d => d.id !== id);
            setOutboundData(updatedOutbound);

            let updatedMaster = [...masterData];
            if (itemToDelete.sn && itemToDelete.sn !== '-') {
              updatedMaster = [{
                item: itemToDelete.namaBarang,
                sn: itemToDelete.sn,
                code: itemToDelete.keterangan !== '-' && !itemToDelete.keterangan.startsWith('Roll') ? itemToDelete.keterangan : '-',
                dateAdded: new Date().toISOString()
              }, ...updatedMaster];
              setMasterData(updatedMaster);
              await syncMasterToSheet(updatedMaster);
            }

            await syncOutboundToSheet(updatedOutbound);
            playSuccessSound();
            showMessage('Data berhasil dihapus' + (itemToDelete.sn !== '-' ? ' & SN dikembalikan ke Gudang.' : '.'));
            setConfirmModal(null);
          };

          const handleBulkImport = async () => {
            if (!importData.trim()) return;
            const rows = importData.trim().split('\n');
            let addedCount = 0;
            const newData = [];

            rows.forEach(row => {
              if (!row.trim()) return;
              const cols = row.split(/\t+|\s{2,}/).map(c => c.trim()).filter(Boolean);
              if (cols.length >= 1) {
                let item = 'MATERIAL GUDANG', sn = '', code = '-';
                if (cols.length >= 3) {
                  if (cols[0].toUpperCase().startsWith('DN')) { code = cols[0]; item = cols[1]; sn = cols[2]; }
                  else { item = cols[0]; sn = cols[1]; code = cols[2]; }
                } else if (cols.length === 2) { 
                    item = cols[0]; sn = cols[1]; 
                } else if (cols.length === 1) { 
                    sn = cols[0]; 
                }

                if (sn && sn !== '-') {
                  newData.push({ 
                      sn: sn.toUpperCase(), 
                      item: item.toUpperCase(), 
                      code: code.toUpperCase(), 
                      dateAdded: new Date().toISOString() 
                  });
                  addedCount++;
                }
              }
            });

            if (newData.length > 0) {
              const updatedMaster = [...newData, ...masterData];
              setMasterData(updatedMaster);
              await syncMasterToSheet(updatedMaster);
              playSuccessSound();
              showMessage(`Berhasil import ${addedCount} data SN ke Google Sheet!`);
            } else {
              playErrorSound();
              showMessage('Format data tidak dikenali. Pastikan ada SN.', 'error');
            }
            
            setImportData('');
            setShowImport(false);
          };

          const updateStatus = async (id, newStatus) => {
            const updated = outboundData.map(item => item.id === id ? { ...item, status: newStatus } : item);
            setOutboundData(updated);
            await syncOutboundToSheet(updated);
            showMessage(`Status diperbarui menjadi ${newStatus}.`);
          };

          const totalPages = Math.ceil(outboundData.length / ITEMS_PER_PAGE);
          const paginatedOutbound = outboundData.slice((currentPage - 1) * ITEMS_PER_PAGE, currentPage * ITEMS_PER_PAGE);

          const deviceStockSummary = useMemo(() => {
            const summary = {};
            masterData.forEach(d => {
                const itemName = d.item.trim().toUpperCase();
                if (!summary[itemName]) summary[itemName] = 0;
                summary[itemName]++;
            });
            return Object.entries(summary).sort((a, b) => b[1] - a[1]);
          }, [masterData]);

          const filteredReportData = useMemo(() => {
            return outboundData.filter(d => {
              if (!d.waktuScan) return false;
              
              // PERBAIKAN: Gunakan Regex /[\sT]/ untuk memisahkan tanggal. 
              // Ini kebal dari format zona waktu Google Sheet (yang memiliki huruf 'T')
              const datePart = d.waktuScan.split(/[\sT]/)[0];
              const [y, m] = datePart.split('-').map(Number);
              
              let isMatch = false;
              if (reportType === 'harian') {
                isMatch = datePart === reportDate;
              } else if (reportType === 'mingguan') {
                isMatch = (m - 1) === reportMonth && y === reportYear && Number(d.week) === Number(reportWeek);
              } else {
                isMatch = (m - 1) === reportMonth && y === reportYear;
              }
              
              if(activeTab === 'report-tech') {
                  return isMatch && d.namaTeknisi === reportTech;
              }
              return isMatch;
            });
          }, [outboundData, reportType, reportDate, reportMonth, reportYear, reportWeek, reportTech, activeTab]);

          const displayedLogData = useMemo(() => {
            return filteredReportData.filter(d => reportStatusFilter === 'ALL' || d.status === reportStatusFilter);
          }, [filteredReportData, reportStatusFilter]);

          const reportAdminStats = useMemo(() => {
            const stats = {};
            const uniqueItems = new Set();
            filteredReportData.forEach(d => {
                const itemName = d.namaBarang === 'Kabel Precon' ? d.kabelPrecon : d.namaBarang;
                uniqueItems.add(itemName);
            });

            uniqueItems.forEach(item => {
                const isCable = CABLE_ITEMS.includes(item);
                stats[item] = { total: 0, install: 0, belum: 0, return: 0, unit: isCable ? 'Pcs' : 'Unit' };
            });
            
            filteredReportData.forEach(d => {
              const itemName = d.namaBarang === 'Kabel Precon' ? d.kabelPrecon : d.namaBarang;
              const itemQty = d.qty || 1;

              if (stats[itemName]) {
                  stats[itemName].total += itemQty;
                  if (d.status === 'INSTALL') stats[itemName].install += itemQty;
                  else if (d.status === 'RETURN') stats[itemName].return += itemQty;
                  else stats[itemName].belum += itemQty;
              }
            });
            return stats;
          }, [filteredReportData]);

          const cableStockSummary = useMemo(() => {
            const summary = {};
            CABLE_ITEMS.forEach(item => {
              const totalMasuk = cableStockInbound.filter(c => c.item === item).reduce((sum, cur) => sum + cur.qty, 0);
              const totalKeluar = outboundData.filter(d => d.kabelPrecon === item).reduce((sum, cur) => sum + (cur.qty || 0), 0);
              summary[item] = { masuk: totalMasuk, keluar: totalKeluar, sisa: totalMasuk - totalKeluar };
            });
            return summary;
          }, [cableStockInbound, outboundData]);

          const barChartData = useMemo(() => {
              return Object.entries(reportAdminStats)
                .filter(([_, s]) => s.total > 0)
                .map(([name, s]) => ({ name, Terpasang: s.install, Pending: s.belum, Return: s.return }))
                .sort((a,b) => (b.Terpasang+b.Pending) - (a.Terpasang+a.Pending))
                .slice(0, 8);
          }, [reportAdminStats]);

          const pieChartData = useMemo(() => {
             const techStats = {};
             const currentMonth = new Date().getMonth();
             outboundData.forEach(d => {
                 if(d.status === 'INSTALL' && d.month === currentMonth) {
                     techStats[d.namaTeknisi] = (techStats[d.namaTeknisi] || 0) + 1;
                 }
             });
             return Object.entries(techStats).map(([name, value]) => ({name, value})).sort((a,b)=>b.value-a.value).slice(0, 5);
          }, [outboundData]);

          const exportToExcel = () => {
            const exportRows = displayedLogData.map((d, index) => ({
              "No": index + 1,
              "Waktu Scan": d.waktuScan,
              "Teknisi": d.namaTeknisi,
              "Serial Number (SN)": d.sn,
              "Nama Barang": d.namaBarang,
              "Kabel Precon": d.kabelPrecon,
              "No WO / Keterangan": d.keterangan,
              "Status Instalasi": d.status
            }));

            const worksheet = XLSX.utils.json_to_sheet(exportRows);
            const workbook = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(workbook, worksheet, "Laporan Inventory");
            
            const wscols = [ {wch:5}, {wch:20}, {wch:20}, {wch:25}, {wch:20}, {wch:35}, {wch:20}, {wch:15} ];
            worksheet['!cols'] = wscols;

            XLSX.writeFile(workbook, `Laporan_${reportType.toUpperCase()}_${new Date().toISOString().split('T')[0]}.xlsx`);
            showMessage('Berhasil mendownload file Excel!');
          };

          const exportToPDF = () => { window.print(); };

          const handlePrintSuratJalan = (d) => {
              const relatedItems = outboundData.filter(item => item.namaTeknisi === d.namaTeknisi && item.waktuScan === d.waktuScan);
              setSuratJalanData({
                  teknisi: d.namaTeknisi,
                  waktu: d.waktuScan,
                  idTransaksi: `TRX-${new Date(d.waktuScan.replace(' ', 'T')).getTime().toString().substr(-6)}`,
                  items: relatedItems
              });
              
              setTimeout(() => {
                  window.print();
                  setTimeout(() => setSuratJalanData(null), 1000);
              }, 300);
          };

          if (!scriptUrl) {
            return (
              <div className="min-h-screen bg-slate-900 flex items-center justify-center p-4">
                <form onSubmit={saveUrl} className="bg-white p-8 rounded-3xl max-w-md w-full shadow-2xl space-y-6">
                  <div className="text-center">
                      <div className="bg-blue-100 w-16 h-16 rounded-full flex items-center justify-center mx-auto mb-4 text-blue-600">
                          <IconLayers />
                      </div>
                      <h2 className="text-2xl font-black text-slate-800">Hubungkan Database</h2>
                      <p className="text-sm text-slate-500 mt-2">Sistem Inventory Gudang Berbasis Google Sheet</p>
                  </div>
                  <div className="space-y-2">
                    <label className="text-xs font-bold text-slate-700 uppercase tracking-wide">URL Web App Apps Script</label>
                    <input 
                        type="text" 
                        value={tempUrl} 
                        onChange={e => setTempUrl(e.target.value)} 
                        placeholder="https://script.google.com/macros/s/.../exec" 
                        className="w-full border-2 border-slate-200 rounded-xl p-3 text-sm outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-200 transition font-mono bg-slate-50"
                        required
                    />
                  </div>
                  <button type="submit" className="w-full py-3 bg-blue-600 hover:bg-blue-700 text-white rounded-xl font-bold shadow-lg shadow-blue-600/30 transition-all active:scale-[0.98]">
                      Simpan & Mulai
                  </button>
                </form>
              </div>
            );
          }

          return (
            <div className="min-h-screen bg-slate-100 font-sans text-slate-900 relative">
              
              {/* --- SURAT JALAN PRINT VIEW --- */}
              {suratJalanData && (
                  <div className="print-only bg-white p-8 w-full h-full text-black">
                      <div className="text-center border-b-4 border-black pb-4 mb-6">
                          <h1 className="text-2xl font-black uppercase tracking-widest">Surat Jalan / Bukti Serah Terima</h1>
                          <p className="text-sm mt-1">Gudang Sentral Operasional IKR & FTTH</p>
                      </div>
                      
                      <div className="flex justify-between mb-8">
                          <div>
                              <p className="text-sm"><span className="font-bold inline-block w-24">ID Transaksi</span>: {suratJalanData.idTransaksi}</p>
                              <p className="text-sm"><span className="font-bold inline-block w-24">Tanggal</span>: {suratJalanData.waktu.split(' ')[0]}</p>
                              <p className="text-sm"><span className="font-bold inline-block w-24">Waktu</span>: {suratJalanData.waktu.split(' ')[1]}</p>
                          </div>
                          <div className="text-right">
                              <p className="text-sm"><span className="font-bold inline-block w-24">Teknisi</span>: <span className="font-black text-lg">{suratJalanData.teknisi}</span></p>
                              <p className="text-sm"><span className="font-bold inline-block w-24">Status</span>: Keluar Gudang (BELUM)</p>
                          </div>
                      </div>

                      <table className="w-full text-left text-sm border-collapse mb-12">
                          <thead>
                              <tr className="border-b-2 border-black">
                                  <th className="p-3 border border-slate-300">No</th>
                                  <th className="p-3 border border-slate-300">Nama Barang / Material</th>
                                  <th className="p-3 border border-slate-300">Serial Number (SN) / Detail</th>
                                  <th className="p-3 border border-slate-300 text-center">Qty</th>
                              </tr>
                          </thead>
                          <tbody>
                              {suratJalanData.items.map((item, idx) => (
                                  <tr key={item.id}>
                                      <td className="p-3 border border-slate-300">{idx + 1}</td>
                                      <td className="p-3 border border-slate-300 font-bold">{item.namaBarang === 'Kabel Precon' ? item.kabelPrecon : item.namaBarang}</td>
                                      <td className="p-3 border border-slate-300 font-mono">{item.sn !== '-' ? item.sn : item.keterangan}</td>
                                      <td className="p-3 border border-slate-300 text-center">{item.qty} {item.unit}</td>
                                  </tr>
                              ))}
                          </tbody>
                      </table>

                      <div className="flex justify-between px-16 mt-16 text-center">
                          <div>
                              <p className="mb-20">Admin Gudang (Yang Menyerahkan),</p>
                              <p className="font-bold underline">_________________________</p>
                          </div>
                          <div>
                              <p className="mb-20">Teknisi (Yang Menerima),</p>
                              <p className="font-bold underline">{suratJalanData.teknisi}</p>
                          </div>
                      </div>
                  </div>
              )}

              {/* --- MAIN APP WRAPPER --- */}
              <div className={`p-4 md:p-8 ${suratJalanData ? 'print:hidden' : ''}`}>
                  
                  {/* Custom Delete Confirmation Modal */}
                  {confirmModal && (
                      <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm modal-overlay">
                          <div className="bg-white rounded-3xl shadow-2xl p-6 md:p-8 max-w-sm w-full">
                              <IconAlertCircle />
                              <h3 className="text-xl font-black text-center text-slate-800 mb-2">{confirmModal.title}</h3>
                              <p className="text-center text-slate-600 text-sm mb-6">{confirmModal.message}</p>
                              <div className="flex gap-3">
                                  <button onClick={() => setConfirmModal(null)} className="flex-1 py-3 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold rounded-xl transition">Batal</button>
                                  <button onClick={confirmDeleteOutbound} className="flex-1 py-3 bg-red-600 hover:bg-red-700 text-white font-bold rounded-xl transition shadow-lg shadow-red-600/30">Hapus</button>
                              </div>
                          </div>
                      </div>
                  )}

                  {/* Password Lock Modal */}
                  {passwordModal && (
                      <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm modal-overlay">
                          <div className="bg-white rounded-3xl shadow-2xl p-6 md:p-8 max-w-sm w-full">
                              <div className="w-12 h-12 bg-red-100 text-red-600 rounded-full flex items-center justify-center mx-auto mb-4">
                                  <IconLock />
                              </div>
                              <h3 className="text-xl font-black text-center text-slate-800 mb-2">Area Terbatas</h3>
                              <p className="text-center text-slate-600 text-sm mb-6">Masukkan password admin untuk membuka akses ke fungsi ini.</p>
                              <form onSubmit={submitAdminPassword}>
                                  <input 
                                      type="password" 
                                      autoFocus
                                      value={adminPasswordInput} 
                                      onChange={e => setAdminPasswordInput(e.target.value)} 
                                      placeholder="Password..." 
                                      className="w-full border-2 border-slate-200 rounded-xl p-3 text-center text-lg focus:border-red-500 focus:ring-4 focus:ring-red-500/10 outline-none font-bold bg-slate-50 transition mb-4"
                                  />
                                  <div className="flex gap-3">
                                      <button type="button" onClick={() => setPasswordModal(false)} className="flex-1 py-3 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold rounded-xl transition">Batal</button>
                                      <button type="submit" className="flex-1 py-3 bg-red-600 hover:bg-red-700 text-white font-bold rounded-xl transition shadow-lg shadow-red-600/30">Buka Akses</button>
                                  </div>
                              </form>
                          </div>
                      </div>
                  )}

                  {/* Camera Scanner Modal */}
                  {isScannerOpen && (
                      <div className="fixed inset-0 z-[60] flex items-center justify-center p-4 bg-slate-900/80 backdrop-blur-sm modal-overlay">
                          <div className="bg-white rounded-3xl shadow-2xl p-6 w-full max-w-md flex flex-col">
                              <div className="flex justify-between items-center mb-4">
                                  <h3 className="text-xl font-black text-slate-800 flex items-center gap-2"><IconCamera /> Scan Barcode</h3>
                                  <button onClick={() => setIsScannerOpen(false)} className="text-slate-400 hover:text-red-500"><IconClose /></button>
                              </div>
                              <div className="w-full bg-slate-50 rounded-2xl border-2 border-dashed border-slate-200 p-2 overflow-hidden relative min-h-[280px]">
                                  <div id="reader" className="w-full h-full"></div>
                              </div>
                              <p className="text-xs text-center text-slate-500 mt-4">Arahkan kamera ke barcode SN perangkat. Pastikan pencahayaan cukup.</p>
                          </div>
                      </div>
                  )}

                  <div className="max-w-7xl mx-auto space-y-6">
                    
                    {/* Header Section */}
                    <header className="bg-blue-800 rounded-3xl p-6 md:p-8 text-white shadow-xl shadow-blue-900/10 flex flex-col md:flex-row justify-between items-center gap-4 no-print relative overflow-hidden">
                      <div className="absolute top-0 right-0 opacity-10 pointer-events-none transform translate-x-1/4 -translate-y-1/4">
                          <svg width="200" height="200" viewBox="0 0 24 24" fill="currentColor"><path d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"/></svg>
                      </div>
                      <div className="relative z-10 text-center md:text-left">
                        <h1 className="text-3xl font-black tracking-tight flex items-center justify-center md:justify-start gap-3">
                            <span className="bg-white/20 p-2 rounded-xl backdrop-blur-sm"><IconPackage /></span> 
                            Inventory Tracker
                        </h1>
                        <p className="text-blue-200 mt-2 font-medium text-sm md:text-base">Sinkronisasi Real-time Database Gudang & Lapangan</p>
                      </div>
                      <div className="flex gap-3 items-center relative z-10">
                        <button onClick={fetchData} className="bg-white/10 backdrop-blur-sm px-4 py-2.5 rounded-xl text-sm font-bold border border-white/20 flex items-center gap-2 hover:bg-white/20 transition shadow-sm">
                          <span className={isLoading ? 'animate-spin' : ''}>🔄</span> {isLoading ? 'Memuat...' : 'Sinkronkan'}
                        </button>
                        <button onClick={() => { localStorage.removeItem('gs_url'); setScriptUrl(''); }} className="text-blue-200 hover:text-white px-3 py-2.5 rounded-xl text-sm font-bold transition hover:bg-white/10">
                            Putus Koneksi
                        </button>
                      </div>
                    </header>

                    {/* Toast Notification */}
                    {toast && (
                      <div className={`fixed top-6 left-1/2 -translate-x-1/2 z-50 px-6 py-3 rounded-full shadow-xl text-sm font-bold text-white transition-all transform duration-300 translate-y-0 ${toast.type === 'error' ? 'bg-red-600 shadow-red-600/30' : 'bg-emerald-600 shadow-emerald-600/30'}`}>
                        {toast.msg}
                      </div>
                    )}

                    {/* Navigation Tabs */}
                    <nav className="flex flex-wrap gap-2 p-1.5 bg-white/50 backdrop-blur-sm border border-slate-200 rounded-2xl no-print shadow-sm">
                      {[
                        { id: 'dashboard', label: 'Dashboard Utama', icon: IconDashboard },
                        { id: 'scan', label: 'Barang Keluar & Scan', icon: IconExchange },
                        { id: 'master', label: 'Master Data SN', icon: IconPackage },
                        { id: 'cable-stock', label: 'Database Kabel', icon: IconLayers },
                        { id: 'report-admin', label: 'Laporan Admin', icon: IconChart },
                        { id: 'report-tech', label: 'Laporan Teknisi', icon: IconUsers },
                      ].map(tab => (
                        <button 
                            key={tab.id} 
                            onClick={() => setActiveTab(tab.id)} 
                            className={`flex items-center px-4 py-3 rounded-xl text-sm font-bold transition-all flex-1 justify-center gap-2 min-w-[140px]

                                </div>

                          {/* Inventory Stock Watching Panels */}

                                        <p className="text-sm mt-2">Master Data Kosong.</p>

                            </div>

                            {/* Cable Stock Panel */}

                                    const stat = cableStockSummary[item] || { sisa: 0 };
                                    const isLow = stat.sisa <= 10 && stat.sisa > 0;
                                    const isEmpty = stat.sisa <= 0;
                                    
                                    return (
                                    <div key={item} className={`p-4 rounded-2xl border transition-colors ${isEmpty ? 'bg-red-50 border-red-100' : isLow ? 'bg-amber-50 border-amber-100' : 'bg-slate-50 border-slate-100'}`}>

                            </div>

                          {/* Recent Outbound Log */}

                                        <IconSearch />
                                        <p className="text-sm mt-2">Belum ada aktivitas barang keluar.</p>
                                    </div>
                                )}
                              </div>
                          </div>

                      {}
                      {activeTab === 'scan' && (

                                  </button>

                                  </div>
                              </div>
                              
                              <button type="submit" className="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 rounded-xl transition shadow-lg shadow-blue-600/30 relative z-10 text-lg">Proses & Tugaskan</button>

                                  </div>
                              </div>
                              
                              <button type="submit" className="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-4 rounded-xl transition shadow-lg shadow-indigo-600/30 relative z-10 text-lg">Catat Pengeluaran</button>
                            </form>
                          </div>

                          {/* History Table */}

                                    <th className="p-4">Status</th>
                                    <th className="p-4 text-center pr-6">Aksi & Surat Jalan</th>
                                  </tr>
                                </thead>
                                <tbody className="divide-y divide-slate-100">
                                  {paginatedOutbound.map(d => (
                                    <tr key={d.id} className="hover:bg-blue-50/30 transition-colors group">

                                                  d.status === 'RETURN' ? 'bg-red-50 text-red-700 border-red-200 hover:border-red-300' : 
                                                  'bg-amber-50 text-amber-700 border-amber-200 hover:border-amber-300'}`}

                                            title="Hapus Data"
                                        >
                                          <IconTrash />
                                        </button>
                                      </td>
                                    </tr>
                                  ))}
                                  {paginatedOutbound.length === 0 && (

                                                  <p className="mt-2 font-medium">Belum ada history transaksi.</p>
                                              </div>
                                          </td>
                                      </tr>
                                  )}
                                </tbody>
                              </table>
                            </div>
                            
                            {/* Pagination Controls */}
                            {totalPages > 1 && (

                                <button disabled={currentPage === totalPages} onClick={() => setCurrentPage(p => p + 1)} className="px-5 py-2.5 bg-white border border-slate-200 rounded-xl shadow-sm disabled:opacity-50 disabled:cursor-not-allowed text-sm font-bold text-slate-600 hover:bg-slate-50 transition">Berikutnya</button>
                              </div>
                            )}
                          </div>
                        </div>
                      )}

                      {}
                      {activeTab === 'master' && (
                        <div className="space-y-6 animate-in fade-in duration-300">
                          
                          <div className="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 bg-white p-6 md:p-8 rounded-3xl shadow-sm border border-slate-100">
                            <div>
                              <h3 className="font-black text-2xl flex items-center gap-3 text-slate-800"><div className="p-2 bg-blue-100 text-blue-600 rounded-xl"><IconPackage /></div> Master Data SN</h3>
                              <p className="text-sm text-slate-500 mt-2 font-medium">Database perangkat siap deploy. Total: <span className="font-black text-slate-800">{masterData.length}</span> item tersimpan.</p>
                            </div>
                            
                            <div className="flex gap-2">
                                {isAdminUnlocked ? (
                                    <button onClick={handleLockAdmin} className="bg-red-50 text-red-600 hover:bg-red-100 font-bold p-3 rounded-xl transition" title="Kunci Akses">
                                        <IconLock />
                                    </button>
                                ) : null}
                                
                                <button onClick={() => isAdminUnlocked ? setShowImport(!showImport) : setPasswordModal(true)} className={`font-bold px-6 py-3 rounded-xl flex items-center gap-2 transition shadow-sm ${showImport ? 'bg-slate-100 text-slate-600 hover:bg-slate-200' : isAdminUnlocked ? 'bg-blue-600 text-white hover:bg-blue-700 shadow-blue-600/20' : 'bg-slate-800 text-white hover:bg-slate-900'}`}>
                                  {!isAdminUnlocked ? <IconLock /> : showImport ? <IconClose /> : <IconUpload />} 
                                  {!isAdminUnlocked ? 'Buka Akses Input' : showImport ? 'Tutup Panel Import' : 'Import Massal (Excel)'}
                                </button>
                            </div>
                          </div>
