<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Inventory Gudang</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
</head>
<body class="bg-slate-100 min-h-screen text-slate-900 font-sans text-sm">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useMemo, useEffect } = React;
        const ITEMS = ['ONT ZTE', 'ONT HUAWEI', 'STB ZTE', 'STB NAVICOM', 'STB TRANSVISION', 'STB HOMATIC', 'STB FIBERHOME'];
        const TECHNICIANS = ['PUTRA-SONY', 'EKO-RIYAN', 'NADI-PARI', 'ARIP', 'NOVAN-GOBY', 'PERI-ROBIN', 'TEDI-DODI', 'DODi-DANIEL-TEDI', 'RAHMAN-FAJAR', 'IQBAL-ARDI', 'RIO-ARI', 'AGUS'];
        const MONTHS = ['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni', 'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'];
        const CABLE_ITEMS = ['DTFIBER - CABLE PRECON SC/UPC-SC/APC - 75MTR', 'DTFIBER - CABLE PRECON SC/UPC-SC/APC - 125MTR', 'DTFIBER - CABLE PRECON SC/UPC-SC/APC - 175MTR', 'DTFIBER - CABLE PRECON SC/UPC-SC/APC - 225MTR', 'DTFIBER - CABLE PRECON SC/UPC-SC/APC - 300MTR'];

        function App() {
            const [scriptUrl, setScriptUrl] = useState(() => localStorage.getItem('gs_url') || '');
            const [activeTab, setActiveTab] = useState('dashboard');
            const [masterData, setMasterData] = useState([]);
            const [outboundData, setOutboundData] = useState([]);
            const [cableStockInbound, setCableStockInbound] = useState([]);
            const [currentPage, setCurrentPage] = useState(1);
            const ITEMS_PER_PAGE = 50;

            // Fetch Data
            const fetchData = async () => {
                if (!scriptUrl) return;
                try {
                    const res = await fetch(scriptUrl);
                    const json = await res.json();
                    if(json.master) setMasterData(json.master.slice(1).map(r => ({item: r[0], sn: r[1], code: r[2]})));
                    if(json.outbound) setOutboundData(json.outbound.slice(1).map(r => ({id: r[0], waktuScan: r[1], namaTeknisi: r[2], sn: r[3], namaBarang: r[4], kabelPrecon: r[5], keterangan: r[6], status: r[7]})));
                    if(json.cables) setCableStockInbound(json.cables.slice(1).map(r => ({id: r[0], item: r[1], qty: Number(r[2])})));
                } catch(e) { console.error(e); }
            };

            useEffect(() => { if (scriptUrl) fetchData(); }, [scriptUrl]);

            // Pagination Logic
            const totalPages = Math.ceil(outboundData.length / ITEMS_PER_PAGE);
            const paginatedOutbound = outboundData.slice((currentPage - 1) * ITEMS_PER_PAGE, currentPage * ITEMS_PER_PAGE);

            const handleDelete = async (id) => {
                if(!confirm("Hapus data ini?")) return;
                const newData = outboundData.filter(d => d.id !== id);
                setOutboundData(newData);
                await fetch(scriptUrl, { method: 'POST', body: JSON.stringify({ type: "saveOutbound", rows: [["ID", "Waktu", "Teknisi", "SN", "Barang", "Kabel", "Ket", "Status"], ...newData.map(d => [d.id, d.waktuScan, d.namaTeknisi, d.sn, d.namaBarang, d.kabelPrecon, d.keterangan, d.status])] }) });
            };

            if (!scriptUrl) {
                return (
                    <div className="min-h-screen bg-slate-900 flex items-center justify-center p-4">
                        <div className="bg-white p-8 rounded-2xl w-full max-w-sm">
                            <h2 className="text-xl font-bold mb-4">Masukkan URL Google Sheet</h2>
                            <input type="text" onChange={(e) => localStorage.setItem('gs_url', e.target.value)} className="w-full border p-2 mb-4 rounded"/>
                            <button onClick={() => window.location.reload()} className="w-full bg-blue-600 text-white py-2 rounded">Simpan & Muat</button>
                        </div>
                    </div>
                );
            }

            return (
                <div className="min-h-screen bg-slate-100 p-4">
                    <div className="max-w-7xl mx-auto">
                        <div className="flex gap-2 mb-4 overflow-x-auto">
                            {['dashboard', 'scan', 'report-admin'].map(tab => (
                                <button key={tab} onClick={() => setActiveTab(tab)} className={`px-4 py-2 rounded-lg font-bold ${activeTab === tab ? 'bg-blue-600 text-white' : 'bg-white'}`}>
                                    {tab.toUpperCase()}
                                </button>
                            ))}
                        </div>

                        {activeTab === 'scan' && (
                            <div className="bg-white p-4 rounded-xl shadow">
                                <h2 className="font-bold mb-4">Riwayat Barang Keluar ({outboundData.length})</h2>
                                <div className="overflow-x-auto">
                                    <table className="w-full text-xs table-fixed">
                                        <thead>
                                            <tr className="bg-slate-100">
                                                <th className="p-2 w-20">Waktu</th>
                                                <th className="p-2 w-24">Teknisi</th>
                                                <th className="p-2 w-24">SN</th>
                                                <th className="p-2">Barang</th>
                                                <th className="p-2 w-20">Aksi</th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            {paginatedOutbound.map(d => (
                                                <tr key={d.id} className="border-b">
                                                    <td className="p-2 truncate">{d.waktuScan.split(' ')[1]}</td>
                                                    <td className="p-2 truncate font-bold">{d.namaTeknisi}</td>
                                                    <td className="p-2 truncate">{d.sn}</td>
                                                    <td className="p-2 truncate">{d.namaBarang}</td>
                                                    <td className="p-2">
                                                        <button onClick={() => handleDelete(d.id)} className="text-red-500 font-bold px-2">HAPUS</button>
                                                    </td>
                                                </tr>
                                            ))}
                                        </tbody>
                                    </table>
                                </div>
                                <div className="mt-4 flex gap-2">
                                    {Array.from({length: totalPages}, (_, i) => i + 1).map(p => (
                                        <button key={p} onClick={() => setCurrentPage(p)} className={`px-3 py-1 border ${currentPage === p ? 'bg-blue-600 text-white' : ''}`}>
                                            {p}
                                        </button>
                                    ))}
                                </div>
                            </div>
                        )}
                        {/* Placeholder untuk tab lain */}
                    </div>
                </div>
            );
        }
        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
